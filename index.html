<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2e5d1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<title>Orchard Defence</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#24451a;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;color:#fff}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#hud{display:flex;align-items:center;gap:6px;padding:6px 8px;padding-top:calc(6px + env(safe-area-inset-top));background:linear-gradient(#3b2a17,#2b1e10);border-bottom:2px solid #6b4a24;font-weight:700;font-size:16px}
.stat{display:flex;align-items:center;gap:3px;background:rgba(0,0,0,.28);border-radius:10px;padding:5px 8px;white-space:nowrap}
#hud .sp{flex:1}
.hb{border:0;border-radius:10px;background:#6b4a24;color:#fff;font-size:17px;font-weight:800;min-width:40px;height:36px;padding:0 8px;box-shadow:0 2px 0 #3b2a12}
.hb:active{transform:translateY(2px);box-shadow:none}
.hb.on{background:#e8a317;color:#3b2a12}
#wrap{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#go{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);border:0;border-radius:24px;padding:12px 22px;font-size:18px;font-weight:900;color:#3b2a12;background:linear-gradient(#ffd54f,#f9a825);box-shadow:0 4px 0 #a16207,0 6px 14px rgba(0,0,0,.4);white-space:nowrap;animation:pulse 1.4s infinite}
#go:active{transform:translateX(-50%) translateY(3px);box-shadow:0 1px 0 #a16207}
#go.early{background:linear-gradient(#aed581,#7cb342);box-shadow:0 4px 0 #33691e;animation:none;font-size:15px;padding:9px 16px}
@keyframes pulse{50%{filter:brightness(1.12)}}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:30px;font-weight:900;text-shadow:0 3px 0 #000,0 0 18px #000;pointer-events:none;opacity:0;transition:opacity .3s}
#bar{background:linear-gradient(#3b2a17,#24180c);border-top:2px solid #6b4a24;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));min-height:104px}
#bar .row{display:flex;gap:6px}
.tb{flex:1;border:2px solid #6b4a24;border-radius:12px;background:#5a3d1e;color:#fff;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:800;font-size:12px;min-width:0}
.tb .ic{width:36px;height:36px;pointer-events:none}
.up .ic{width:44px;height:44px;flex:none}
.tb .c{color:#ffd54f;font-size:14px}
.tb.armed{border-color:#ffd54f;background:#7a5426;box-shadow:0 0 0 2px #ffd54f inset}
.tb.dis{opacity:.45;filter:grayscale(.6)}
.tb:active{transform:scale(.96)}
.hint{text-align:center;font-size:12px;opacity:.8;margin-top:5px;height:15px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.up{display:flex;align-items:center;gap:6px}
.up .info{flex:1;min-width:0;font-size:12px;line-height:1.35}
.up .info b{font-size:16px}
.ab{border:0;border-radius:12px;padding:10px 6px;font-weight:900;font-size:14px;color:#fff;min-width:62px;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.ab:active{transform:translateY(2px);box-shadow:none}
.ab.g{background:#43a047}.ab.r{background:#c62828}.ab.n{background:#6b4a24;min-width:44px}
.ab.dis{opacity:.45}
#ov{position:absolute;inset:0;background:rgba(15,25,8,.82);display:flex;align-items:center;justify-content:center;z-index:5;padding:18px}
#ov.hide{display:none}
.card{background:linear-gradient(#fff8e1,#ffe9b0);color:#3b2a12;border-radius:20px;padding:20px 18px;max-width:380px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);border:3px solid #a16207}
.card h1{margin:0 0 4px;font-size:32px;line-height:1.1}
.card h2{margin:0 0 6px;font-size:26px}
.card p{margin:8px 0;font-size:14px;line-height:1.4}
.card .big{font-size:56px;line-height:1.1}
.card .bb{display:block;width:100%;border:0;border-radius:16px;padding:14px;margin-top:12px;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(#66bb6a,#2e7d32);box-shadow:0 4px 0 #1b5e20}
.card .bb.alt{background:linear-gradient(#a1887f,#6d4c41);box-shadow:0 4px 0 #3e2723;font-size:17px;padding:11px}
.card .bb:active{transform:translateY(3px);box-shadow:none}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;text-align:left;font-size:12.5px;margin:10px 0;background:rgba(161,98,7,.12);border-radius:10px;padding:8px}
.best{font-weight:800;color:#a16207}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat" title="Mangoes left">🥭 <span id="lives">20</span></div>
    <div class="stat">💰 <span id="money">0</span></div>
    <div class="stat">🌊 <span id="wave">0/15</span></div>
    <div class="sp"></div>
    <button class="hb" id="bSpeed">1×</button>
    <button class="hb" id="bMute">🔊</button>
    <button class="hb" id="bPause">⏸</button>
  </div>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="banner"></div>
    <button id="go">▶ Start Wave 1</button>
    <div id="ov"></div>
  </div>
  <div id="bar"></div>
</div>
<script>
(function(){
'use strict';
// ---------- config ----------
const COLS=9, ROWS=16, TOTAL_WAVES=15, START_MONEY=130, START_LIVES=20;
const PATH=[[4,-1.2],[4,1],[1,1],[1,4],[7,4],[7,7],[1,7],[1,10],[7,10],[7,13],[4,13],[4,14.35]];
const DECOR=[[8,0,'🌴'],[0,6,'🪨'],[8,12,'🌳'],[5,2,'🌳'],[0,13,'🪨'],[4,8.5,null]];
const TOWERS={
  farmer:{name:'Farmer Jesse',icon:'👨‍🌾',color:'#8d6e63',cost:50,up:[60,115],air:true,ground:true,
    desc:'Shotgun. Hits everything.',
    lv:[{dmg:15,range:2.4,rate:0.85},{dmg:26,range:2.7,rate:0.75},{dmg:44,range:3.0,rate:0.6}]},
  sprinkler:{name:'Sprinkler',icon:'💧',color:'#29b6f6',cost:40,up:[45,85],air:false,ground:true,
    desc:'Soaks & slows ground pests.',
    lv:[{dmg:3,range:1.6,rate:0.5,slow:0.5},{dmg:6,range:1.9,rate:0.5,slow:0.4},{dmg:10,range:2.2,rate:0.5,slow:0.3}]},
  scare:{name:'Net Scarecrow',icon:'🕸️',color:'#d4a017',cost:65,up:[70,125],air:true,ground:false,
    desc:'Fires nets. Flyers only, big hits.',
    lv:[{dmg:34,range:3.0,rate:1.05},{dmg:62,range:3.4,rate:0.95},{dmg:105,range:3.8,rate:0.8}]},
  spray:{name:'Spray Rig',icon:'🚜',color:'#e53935',cost:90,up:[95,160],air:false,ground:true,
    desc:'Area spray. Ground pests.',
    lv:[{dmg:20,range:1.75,rate:1.4},{dmg:36,range:1.95,rate:1.25},{dmg:62,range:2.2,rate:1.1}]}
};
const TORDER=['farmer','sprinkler','scare','spray'];
const ENEMIES={
  fly:  {name:'Fruit Fly',  emoji:'🪰',hp:22, speed:1.9, reward:4, air:false,size:.30,dmg:1},
  cocky:{name:'Cockatoo',   emoji:null,hp:58, speed:1.3, reward:8, air:true, size:.40,dmg:1},
  bat:  {name:'Flying Fox', emoji:'🦇',hp:44, speed:2.15,reward:9, air:true, size:.40,dmg:1},
  pig:  {name:'Wild Pig',   emoji:'🐗',hp:230,speed:0.8, reward:18,air:false,size:.46,dmg:2},
  boss: {name:'Big Tusker', emoji:'🐗',hp:2000,speed:0.5,reward:150,air:false,size:.78,dmg:10,boss:true}
};
// wave groups: [type,count,gap(s),startAt(s),hpMul?]
const WAVES=[
  [['fly',10,0.9,0]],
  [['fly',14,0.7,0],['cocky',3,1.5,6]],
  [['cocky',8,1.1,0],['fly',10,0.6,4]],
  [['fly',12,0.55,0],['pig',2,3,5]],
  [['bat',10,0.8,0],['cocky',6,1.2,3]],
  [['fly',16,0.45,0],['pig',4,2.4,3]],
  [['bat',12,0.7,0],['cocky',10,0.9,2]],
  [['fly',20,0.4,0],['pig',6,2,4],['bat',6,0.8,8]],
  [['cocky',15,0.65,0],['bat',15,0.6,3]],
  [['pig',6,1.8,0],['boss',1,1,6,0.5]],
  [['fly',30,0.28,0],['bat',10,0.6,5]],
  [['pig',10,1.4,0],['cocky',12,0.7,3]],
  [['bat',20,0.45,0],['cocky',20,0.5,2],['pig',6,1.6,6]],
  [['fly',30,0.3,0],['pig',14,1.1,3],['bat',14,0.5,8]],
  [['pig',8,1.5,0],['bat',15,0.5,4],['boss',1,1,9,1]]
];
const hpMul=w=>1+0.14*(w-1)+0.013*(w-1)*(w-1);

// ---------- dom ----------
const $=id=>document.getElementById(id);
const cv=$('cv');let ctx=cv.getContext('2d');const wrap=$('wrap'), bar=$('bar'), ov=$('ov'), goBtn=$('go'), banner=$('banner');
let W=0,H=0,DPR=1,T=32,OX=0,OY=0,bg=null;

// ---------- path geometry ----------
const segs=[];let pathLen=0;
for(let i=0;i<PATH.length-1;i++){const [x1,y1]=PATH[i],[x2,y2]=PATH[i+1];const L=Math.hypot(x2-x1,y2-y1);segs.push({x1,y1,x2,y2,L,s:pathLen});pathLen+=L;}
function posAt(d){ // tile coords (centre of tiles at +.5)
  if(d<=0)return {x:PATH[0][0]+.5,y:PATH[0][1]+.5};
  for(const s of segs){if(d<=s.s+s.L){const t=(d-s.s)/s.L;return {x:s.x1+(s.x2-s.x1)*t+.5,y:s.y1+(s.y2-s.y1)*t+.5,dx:Math.sign(s.x2-s.x1)};}}
  const l=PATH[PATH.length-1];return {x:l[0]+.5,y:l[1]+.5};
}
const grid=[];for(let r=0;r<ROWS;r++){grid.push(new Array(COLS).fill(0));} // 0 buildable,1 path,2 blocked,3 orchard
for(const s of segs){const n=Math.ceil(s.L*4);for(let i=0;i<=n;i++){const x=Math.round(s.x1+(s.x2-s.x1)*i/n),y=Math.round(s.y1+(s.y2-s.y1)*i/n);if(y>=0&&y<ROWS&&x>=0&&x<COLS)grid[y][x]=1;}}
for(let r=14;r<ROWS;r++)for(let c=0;c<COLS;c++)grid[r][c]=3;
for(const d of DECOR){if(d[2])grid[d[1]][d[0]]=2;}

// ---------- state ----------
let G=null;
const best=(()=>{try{return JSON.parse(localStorage.getItem('od_best')||'{}')}catch(e){return{}}})();
let muted=false;try{muted=localStorage.getItem('od_mute')==='1'}catch(e){}
function newGame(){
  G={money:START_MONEY,lives:START_LIVES,wave:0,towers:[],enemies:[],shots:[],parts:[],texts:[],rings:[],
     spawnQ:[],waveTime:0,spawning:false,running:false,paused:false,speed:1,over:false,score:0,kills:0,
     sel:null,armed:null,shake:0,flash:0,time:0};
  hudDirty=true;barDirty=true;updateGo();
}
let hudDirty=true,barDirty=true,lastMoney=-1;

// ---------- audio ----------
let AC=null;const lastS={};
function audioInit(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,dur,type,vol,f2,delay){if(!AC||muted)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);}
function noise(dur,vol,hp){if(!AC||muted)return;const n=AC.sampleRate*dur|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=AC.createGain();g.gain.value=vol||.1;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();}
function sfx(k){if(!AC||muted)return;const now=performance.now();if(lastS[k]&&now-lastS[k]<(k==='pop'?40:70))return;lastS[k]=now;
  switch(k){case 'bang':noise(.12,.13,600);tone(140,.08,'square',.05,60);break;
  case 'net':tone(500,.12,'triangle',.06,200);break;
  case 'spray':noise(.3,.06,2500);break;
  case 'drip':tone(1200,.05,'sine',.025,900);break;
  case 'pop':tone(700,.07,'square',.04,1300);break;
  case 'coin':tone(990,.06,'square',.04);tone(1320,.1,'square',.04,null,.06);break;
  case 'build':tone(300,.08,'triangle',.08,600);tone(600,.1,'triangle',.06,null,.07);break;
  case 'up':[440,550,660,880].forEach((f,i)=>tone(f,.09,'triangle',.06,null,i*.06));break;
  case 'sell':tone(800,.1,'square',.04,300);break;
  case 'leak':tone(220,.25,'sawtooth',.08,90);break;
  case 'wave':tone(392,.12,'triangle',.08);tone(523,.18,'triangle',.08,null,.12);break;
  case 'boss':tone(110,.6,'sawtooth',.1,55);tone(82,.8,'sawtooth',.08,40,.3);break;
  case 'win':[523,659,784,1046].forEach((f,i)=>tone(f,.2,'triangle',.08,null,i*.15));break;
  case 'lose':[392,330,262,196].forEach((f,i)=>tone(f,.25,'sawtooth',.06,null,i*.2));break;
  case 'err':tone(160,.12,'square',.05);break;}
}

// ---------- emoji cache ----------
const ecache=new Map();
function emo(ch,px){const key=ch+'|'+Math.round(px*DPR);let c=ecache.get(key);if(!c){const s=Math.ceil(px*DPR*1.3);c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');x.font=Math.round(px*DPR)+'px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(ch,s/2,s/2+px*DPR*.06);ecache.set(key,c);}return c;}
function drawEmo(ch,x,y,px,flip){const c=emo(ch,px),s=c.width/DPR;if(flip){ctx.save();ctx.translate(x,y);ctx.scale(-1,1);ctx.drawImage(c,-s/2,-s/2,s,s);ctx.restore();}else ctx.drawImage(c,x-s/2,y-s/2,s,s);}

// ---------- layout ----------
function resize(){
  const r=wrap.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);DPR=Math.min(3,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  T=Math.floor(Math.min(W/COLS,H/ROWS)*100)/100;OX=(W-T*COLS)/2;OY=(H-T*ROWS)/2;
  ecache.clear();buildBg();makeIcons();barDirty=true;
}
const ICONS={};
function makeIcons(){const sv=[ctx,OX,OY,T],S=44;for(const k of TORDER){const c=document.createElement('canvas');c.width=c.height=Math.round(S*DPR);ctx=c.getContext('2d');ctx.scale(DPR,DPR);OX=0;OY=0;T=S;drawTower({type:k,x:.5,y:.52,lv:-1,ang:-.7,anim:0,spin:.4});ICONS[k]=c.toDataURL();}[ctx,OX,OY,T]=sv;}
function rnd(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return s/2147483647;};}
function buildBg(){
  bg=document.createElement('canvas');bg.width=cv.width;bg.height=cv.height;const b=bg.getContext('2d');b.scale(DPR,DPR);
  const R=rnd(42);
  b.fillStyle='#4f8a2b';b.fillRect(0,0,W,H);
  for(let r=-1;r<=ROWS;r++)for(let c=-2;c<COLS+2;c++){const x=OX+c*T,y=OY+r*T;b.fillStyle=((r+c)&1)?'#5c9a33':'#56932f';b.fillRect(x,y,T+.5,T+.5);}
  // grass tufts
  for(let i=0;i<260;i++){const x=R()*W,y=R()*H;b.strokeStyle='rgba(30,70,15,.35)';b.lineWidth=1;b.beginPath();b.moveTo(x,y);b.lineTo(x-2,y-4);b.moveTo(x,y);b.lineTo(x+2,y-4);b.stroke();}
  // build spots subtle markers
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c]===0){const x=OX+c*T,y=OY+r*T;b.strokeStyle='rgba(255,255,255,.10)';b.lineWidth=1;rr(b,x+3,y+3,T-6,T-6,6);b.stroke();}
  // path (dirt track)
  b.lineCap='round';b.lineJoin='round';
  const tp=(w,col)=>{b.strokeStyle=col;b.lineWidth=w;b.beginPath();PATH.forEach(([x,y],i)=>{const px=OX+(x+.5)*T,py=OY+(y+.5)*T;i?b.lineTo(px,py):b.moveTo(px,py);});b.stroke();};
  tp(T*.98,'#7a5a2e');tp(T*.86,'#b88d55');tp(T*.6,'#c79c63');
  for(let i=0;i<500;i++){const d=R()*pathLen,p=posAt(d),ox=(R()-.5)*T*.75,oy=(R()-.5)*T*.75;b.fillStyle=R()<.5?'rgba(90,60,25,.35)':'rgba(230,200,150,.35)';b.fillRect(OX+p.x*T+ox,OY+p.y*T+oy,2,2);}
  // orchard area
  const oy=OY+14*T;const gr=b.createLinearGradient(0,oy,0,oy+2*T);gr.addColorStop(0,'#3f7a22');gr.addColorStop(1,'#2f6219');b.fillStyle=gr;b.fillRect(0,oy,W,H-oy);
  b.strokeStyle='#8d6e63';b.lineWidth=2;b.setLineDash([6,4]);b.beginPath();b.moveTo(0,oy+1);b.lineTo(W,oy+1);b.stroke();b.setLineDash([]);
  // decor
  for(const d of DECOR){if(!d[2])continue;const c=emo(d[2],T*.8),s=c.width/DPR;b.drawImage(c,OX+(d[0]+.5)*T-s/2,OY+(d[1]+.5)*T-s/2,s,s);}
  // start sign
  b.fillStyle='rgba(0,0,0,.35)';rr(b,OX+5.1*T,OY+0.15*T,T*2.6,T*.6,6);b.fill();b.fillStyle='#fff';b.font='bold '+Math.round(T*.32)+'px sans-serif';b.textAlign='center';b.textBaseline='middle';b.fillText('⚠ PESTS',OX+6.4*T,OY+0.46*T);
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

// ---------- orchard trees (lives display) ----------
const TREE_POS=[];for(let i=0;i<5;i++)TREE_POS.push([0.9+i*1.8,14.95+(i%2)*0.35]);
function drawOrchard(){
  const perTree=START_LIVES/TREE_POS.length;
  TREE_POS.forEach(([tx,ty],i)=>{
    const x=OX+tx*T,y=OY+ty*T,R=T*.62;
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x,y+R*.75,R*.9,R*.3,0,0,7);ctx.fill();
    ctx.fillStyle='#6d4c2e';ctx.fillRect(x-T*.07,y,T*.14,R*.8);
    ctx.fillStyle='#2e7d32';ctx.beginPath();ctx.arc(x,y-R*.15,R,0,7);ctx.fill();
    ctx.fillStyle='#388e3c';ctx.beginPath();ctx.arc(x-R*.3,y-R*.4,R*.55,0,7);ctx.fill();
    const left=Math.max(0,Math.min(perTree,G.lives-i*perTree));
    for(let k=0;k<4;k++){if(k>=Math.ceil(left))break;const a=k*1.6+0.4;ctx.fillStyle='#ffb300';ctx.beginPath();ctx.ellipse(x+Math.cos(a)*R*.55,y-R*.1+Math.sin(a)*R*.45,T*.11,T*.14,a,0,7);ctx.fill();ctx.fillStyle='#e65100';ctx.beginPath();ctx.arc(x+Math.cos(a)*R*.55+T*.03,y-R*.1+Math.sin(a)*R*.45+T*.04,T*.05,0,7);ctx.fill();}
  });
}

// ---------- waves ----------
function startWave(){
  if(G.over||G.wave>=TOTAL_WAVES)return;
  if(G.running&&G.spawning)return;
  let bonus=0;if(G.enemies.length>0&&G.wave>0){bonus=10+G.wave*2;G.money+=bonus;addText(W/2,H*.4,'+$'+bonus+' early!','#c5e1a5',true);}
  G.wave++;G.running=true;G.spawning=true;G.waveTime=0;
  const m=hpMul(G.wave);
  for(const [t,n,gap,at,bm] of WAVES[G.wave-1])for(let i=0;i<n;i++)G.spawnQ.push({t,at:at+i*gap,hp:ENEMIES[t].hp*m*(bm||1)});
  G.spawnQ.sort((a,b)=>a.at-b.at);
  const hasBoss=WAVES[G.wave-1].some(g=>g[0]==='boss');
  showBanner(hasBoss?'🐗 BIG TUSKER INCOMING!':(G.wave===TOTAL_WAVES?'Final wave!':'Wave '+G.wave));
  sfx(hasBoss?'boss':'wave');if(hasBoss)G.shake=.6;
  hudDirty=true;updateGo();
}
function spawn(q){const d=ENEMIES[q.t];G.enemies.push({t:q.t,def:d,hp:q.hp,max:q.hp,d:-Math.random()*.3,speed:d.speed*(0.92+Math.random()*.16),slowF:1,slowT:0,hit:0,wob:Math.random()*6.28,off:(Math.random()-.5)*.35,x:0,y:0});}
let bannerT=0;
function showBanner(t){banner.textContent=t;banner.style.opacity=1;bannerT=1.8;}
function updateGo(){
  if(!G||G.over){goBtn.style.display='none';return;}
  if(G.wave>=TOTAL_WAVES||(G.running&&G.spawning)){goBtn.style.display='none';return;}
  goBtn.style.display='block';
  if(G.enemies.length>0&&G.wave>0){goBtn.className='early';goBtn.textContent='⏩ Wave '+(G.wave+1)+' early (+$'+(10+G.wave*2)+')';}
  else{goBtn.className='';goBtn.textContent=G.wave===0?'▶ Start Wave 1':'▶ Start Wave '+(G.wave+1);}
}

// ---------- effects ----------
function addPart(x,y,n,col,spd,size,life,grav){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(spd||60)*(0.3+Math.random());G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:(life||.5)*(0.6+Math.random()*.6),max:life||.5,col,size:size||2.5,g:grav||0});}if(G.parts.length>600)G.parts.splice(0,G.parts.length-600);}
function addText(x,y,s,col,big){G.texts.push({x,y,s,col:col||'#ffd54f',life:big?1.4:.8,max:big?1.4:.8,big});}

// ---------- update ----------
function inRange(tw,e,r){const dx=e.x-tw.x,dy=e.y-tw.y;return dx*dx+dy*dy<=r*r;}
function damage(e,dmg,src){if(e.hp<=0)return;e.hp-=dmg;e.hit=.1;if(e.hp<=0)kill(e);}
function kill(e){
  const px=OX+e.x*T,py=OY+e.y*T,d=e.def;
  G.money+=d.reward;G.score+=d.reward*10;G.kills++;hudDirty=true;
  addText(px,py-T*.3,'+$'+d.reward);
  addPart(px,py,d.boss?40:10,e.def.air?'#eeeeee':(e.t==='fly'?'#9ccc65':'#8d6e63'),d.boss?160:70,d.boss?4:2.5,.6);
  if(d.boss){G.shake=.7;addPart(px,py,30,'#ffd54f',200,3,.9);}
  sfx(d.boss?'coin':'pop');if(d.reward>=8)sfx('coin');
}
function update(dt){
  G.time+=dt;
  if(G.spawning){G.waveTime+=dt;while(G.spawnQ.length&&G.spawnQ[0].at<=G.waveTime)spawn(G.spawnQ.shift());if(!G.spawnQ.length){G.spawning=false;updateGo();}}
  // enemies
  for(const e of G.enemies){
    if(e.slowT>0){e.slowT-=dt;if(e.slowT<=0)e.slowF=1;}
    e.d+=e.speed*e.slowF*dt;e.wob+=dt*(e.def.air?6:10);if(e.hit>0)e.hit-=dt;
    const p=posAt(e.d);e.x=p.x+(e.def.boss?0:e.off*(p.dx?0:1));e.y=p.y+(e.def.boss?0:e.off*(p.dx?1:0));if(p.dx)e.face=p.dx;
    if(e.d>=pathLen){e.hp=0;e.leaked=true;G.lives-=e.def.dmg;G.flash=.5;G.shake=Math.max(G.shake,.25);hudDirty=true;sfx('leak');
      addText(OX+e.x*T,OY+e.y*T-T*.4,'-'+e.def.dmg+' 🥭','#ff8a80',true);
      if(G.lives<=0){G.lives=0;endGame(false);}}
  }
  // towers
  for(const tw of G.towers){
    const def=TOWERS[tw.type],L=def.lv[tw.lv];tw.cd-=dt;if(tw.anim>0)tw.anim-=dt;tw.spin+=dt*(tw.type==='sprinkler'?3:0);
    if(tw.cd>0)continue;
    if(tw.type==='sprinkler'){
      let any=false;for(const e of G.enemies){if(e.hp>0&&!e.def.air&&inRange(tw,e,L.range)){any=true;e.slowF=Math.min(e.slowF===1?1:e.slowF,L.slow);e.slowF=L.slow;e.slowT=.7;damage(e,L.dmg);}}
      if(any){tw.cd=L.rate;for(let i=0;i<5;i++){const a=Math.random()*6.28,r=Math.random()*L.range*T;G.parts.push({x:OX+tw.x*T+Math.cos(a)*r,y:OY+tw.y*T+Math.sin(a)*r,vx:0,vy:-20,life:.4,max:.4,col:'#81d4fa',size:2.5,g:60});}sfx('drip');}
      continue;
    }
    if(tw.type==='spray'){
      let any=false;for(const e of G.enemies){if(e.hp>0&&!e.def.air&&inRange(tw,e,L.range)){any=true;break;}}
      if(any){tw.cd=L.rate;tw.anim=.25;G.rings.push({x:tw.x,y:tw.y,r:0,max:L.range,life:.45,col:'rgba(186,255,120,'});
        for(const e of G.enemies)if(e.hp>0&&!e.def.air&&inRange(tw,e,L.range))damage(e,L.dmg);
        addPart(OX+tw.x*T,OY+tw.y*T,14,'rgba(200,255,150,.8)',L.range*T*1.6,3.5,.45);sfx('spray');}
      continue;
    }
    // single target: furthest along
    let tgt=null;for(const e of G.enemies){if(e.hp<=0)continue;if(e.def.air?!def.air:!def.ground)continue;if(inRange(tw,e,L.range)&&(!tgt||e.d>tgt.d))tgt=e;}
    if(!tgt)continue;
    tw.cd=L.rate;tw.ang=Math.atan2(tgt.y-tw.y,tgt.x-tw.x);tw.anim=.12;
    if(tw.type==='farmer'){
      damage(tgt,L.dmg);G.shots.push({x1:tw.x,y1:tw.y,x2:tgt.x,y2:tgt.y,life:.08});
      addPart(OX+tgt.x*T,OY+tgt.y*T,5,'#ffe082',80,2,.25);sfx('bang');
    }else{ // net
      G.shots.push({net:true,x:tw.x,y:tw.y,tgt,dmg:L.dmg,life:3,lx:tgt.x,ly:tgt.y,splash:tw.lv===2});sfx('net');
    }
  }
  // projectiles
  for(const s of G.shots){
    if(!s.net){s.life-=dt;continue;}
    if(s.tgt&&s.tgt.hp>0){s.lx=s.tgt.x;s.ly=s.tgt.y;}
    const dx=s.lx-s.x,dy=s.ly-s.y,dd=Math.hypot(dx,dy),sp=8*dt;s.rot=(s.rot||0)+dt*10;
    if(dd<=sp+.05){s.life=0;if(s.tgt&&s.tgt.hp>0){damage(s.tgt,s.dmg);}
      if(s.splash)for(const e of G.enemies)if(e!==s.tgt&&e.hp>0&&e.def.air&&Math.hypot(e.x-s.lx,e.y-s.ly)<.9)damage(e,s.dmg*.5);
      addPart(OX+s.lx*T,OY+s.ly*T,8,'#fff59d',60,2,.35);}
    else{s.x+=dx/dd*sp;s.y+=dy/dd*sp;s.life-=dt;}
  }
  G.shots=G.shots.filter(s=>s.life>0);
  G.enemies=G.enemies.filter(e=>e.hp>0);
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=.96;p.vy*=.96;p.life-=dt;}
  G.parts=G.parts.filter(p=>p.life>0);
  for(const t of G.texts){t.y-=(t.big?18:30)*dt;t.life-=dt;}G.texts=G.texts.filter(t=>t.life>0);
  for(const r of G.rings){r.life-=dt;r.r=r.max*(1-r.life/.45);}G.rings=G.rings.filter(r=>r.life>0);
  if(G.shake>0)G.shake-=dt;if(G.flash>0)G.flash-=dt;
  // wave end
  if(G.running&&!G.spawning&&G.enemies.length===0&&!G.over){
    G.running=false;const bonus=20+G.wave*4;G.money+=bonus;hudDirty=true;
    if(G.wave>=TOTAL_WAVES){endGame(true);}
    else{showBanner('Wave '+G.wave+' cleared! +$'+bonus);sfx('coin');}
    updateGo();
  }else if(G.running&&!G.spawning){updateGo();}
}

// ---------- render ----------
function drawCocky(x,y,s,flap,flip,hit){
  ctx.save();ctx.translate(x,y);if(flip<0)ctx.scale(-1,1);
  const w=Math.sin(flap)*.6;
  ctx.fillStyle=hit?'#ffcdd2':'#f5f5f5';
  ctx.save();ctx.rotate(-.4-w);ctx.beginPath();ctx.ellipse(-s*.35,-s*.1,s*.55,s*.2,0,0,7);ctx.fill();ctx.restore();
  ctx.beginPath();ctx.ellipse(0,0,s*.55,s*.4,0,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(s*.45,-s*.25,s*.28,0,7);ctx.fill();
  ctx.fillStyle='#fdd835';ctx.beginPath();ctx.moveTo(s*.35,-s*.45);ctx.lineTo(s*.2,-s*.9);ctx.lineTo(s*.5,-s*.5);ctx.lineTo(s*.45,-s*.95);ctx.lineTo(s*.62,-s*.45);ctx.fill();
  ctx.fillStyle='#424242';ctx.beginPath();ctx.moveTo(s*.68,-s*.28);ctx.lineTo(s*.88,-s*.18);ctx.lineTo(s*.66,-s*.1);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(s*.52,-s*.3,s*.05,0,7);ctx.fill();
  ctx.fillStyle=hit?'#ffcdd2':'#eeeeee';ctx.save();ctx.rotate(.3+w);ctx.beginPath();ctx.ellipse(-s*.25,s*.05,s*.5,s*.18,0,0,7);ctx.fill();ctx.restore();
  ctx.restore();
}
function drawTower(tw,sel){
  const def=TOWERS[tw.type],x=OX+tw.x*T,y=OY+tw.y*T,s=T*.46;
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x,y+s*.75,s*.95,s*.35,0,0,7);ctx.fill();
  // base
  ctx.fillStyle='#5d4037';rr(ctx,x-s,y-s*.75,s*2,s*1.65,s*.4);ctx.fill();
  ctx.fillStyle=def.color;rr(ctx,x-s*.88,y-s*.85,s*1.76,s*1.5,s*.35);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.18)';rr(ctx,x-s*.8,y-s*.8,s*1.6,s*.5,s*.25);ctx.fill();
  const bob=tw.anim>0?-2:0;
  if(tw.type==='farmer'){
    ctx.save();ctx.translate(x,y-s*.05);ctx.rotate(tw.ang);ctx.fillStyle='#37474f';ctx.fillRect(s*.1,-s*.09,s*(tw.anim>0?.85:1),s*.18);ctx.fillStyle='#795548';ctx.fillRect(-s*.1,-s*.11,s*.3,s*.22);
    if(tw.anim>0.06){ctx.fillStyle='#ffeb3b';ctx.beginPath();ctx.arc(s*1.15,0,s*.22,0,7);ctx.fill();}ctx.restore();
    drawEmo(def.icon,x,y-s*.2+bob,T*.62);
  }else if(tw.type==='sprinkler'){
    ctx.save();ctx.translate(x,y-s*.1);ctx.rotate(tw.spin);ctx.strokeStyle='#e1f5fe';ctx.lineWidth=s*.16;ctx.lineCap='round';
    for(let i=0;i<3;i++){ctx.rotate(2.094);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(s*.62,0);ctx.stroke();}ctx.restore();
    ctx.fillStyle='#0277bd';ctx.beginPath();ctx.arc(x,y-s*.1,s*.25,0,7);ctx.fill();
    drawEmo('💧',x+s*.45,y-s*.6,T*.3);
  }else if(tw.type==='scare'){
    ctx.strokeStyle='#5d4037';ctx.lineWidth=s*.14;ctx.beginPath();ctx.moveTo(x,y+s*.5);ctx.lineTo(x,y-s*.6);ctx.moveTo(x-s*.7,y-s*.15);ctx.lineTo(x+s*.7,y-s*.15);ctx.stroke();
    ctx.fillStyle='#c62828';ctx.fillRect(x-s*.32,y-s*.3,s*.64,s*.55);
    ctx.fillStyle='#ffe0b2';ctx.beginPath();ctx.arc(x,y-s*.6+bob,s*.27,0,7);ctx.fill();
    ctx.fillStyle='#f9a825';ctx.beginPath();ctx.ellipse(x,y-s*.78+bob,s*.5,s*.11,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(x,y-s*.9+bob,s*.25,s*.18,0,0,7);ctx.fill();
    ctx.fillStyle='#000';ctx.fillRect(x-s*.12,y-s*.64+bob,s*.06,s*.06);ctx.fillRect(x+s*.06,y-s*.64+bob,s*.06,s*.06);
  }else{
    drawEmo(def.icon,x,y-s*.15+bob,T*.7,true);
    if(tw.anim>0){ctx.fillStyle='rgba(200,255,150,.35)';ctx.beginPath();ctx.arc(x,y,s*1.3*(1-tw.anim*2),0,7);ctx.fill();}
  }
  // level pips
  for(let i=0;i<=tw.lv;i++){ctx.fillStyle='#ffd54f';ctx.strokeStyle='#5d4037';ctx.lineWidth=1;const px=x-s*.5+i*s*.5,py=y+s*.72;ctx.beginPath();ctx.arc(px,py,s*.15,0,7);ctx.fill();ctx.stroke();}
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  let sx=0,sy=0;if(G.shake>0){sx=(Math.random()-.5)*8*G.shake;sy=(Math.random()-.5)*8*G.shake;}
  ctx.save();ctx.translate(sx,sy);
  ctx.drawImage(bg,-0,0,W,H);
  drawOrchard();
  // selection / range
  const sel=G.sel;
  if(sel&&sel.kind==='spot'){const x=OX+sel.c*T,y=OY+sel.r*T;ctx.strokeStyle='#ffd54f';ctx.lineWidth=3;rr(ctx,x+2,y+2,T-4,T-4,6);ctx.stroke();
    if(G.armed){drawRange(sel.c+.5,sel.r+.5,TOWERS[G.armed].lv[0].range);}}
  if(sel&&sel.kind==='tower'){const tw=sel.tw;drawRange(tw.x,tw.y,TOWERS[tw.type].lv[tw.lv].range);}
  // rings
  for(const r of G.rings){ctx.strokeStyle=r.col+(r.life/.45*.8)+')';ctx.lineWidth=T*.18;ctx.beginPath();ctx.arc(OX+r.x*T,OY+r.y*T,r.r*T,0,7);ctx.stroke();}
  // ground enemies then towers then air
  const ground=G.enemies.filter(e=>!e.def.air),air=G.enemies.filter(e=>e.def.air);
  for(const e of ground)drawEnemy(e);
  for(const tw of G.towers)drawTower(tw);
  for(const e of air)drawEnemy(e);
  // shots
  for(const s of G.shots){
    if(!s.net){ctx.strokeStyle='rgba(255,236,130,'+(s.life/.08)+')';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(OX+s.x1*T,OY+s.y1*T);ctx.lineTo(OX+s.x2*T,OY+s.y2*T);ctx.stroke();}
    else{const x=OX+s.x*T,y=OY+s.y*T,r=T*.2;ctx.save();ctx.translate(x,y);ctx.rotate(s.rot);ctx.strokeStyle='#fff8e1';ctx.lineWidth=1.5;ctx.beginPath();for(let i=-1;i<=1;i++){ctx.moveTo(-r,i*r*.6);ctx.lineTo(r,i*r*.6);ctx.moveTo(i*r*.6,-r);ctx.lineTo(i*r*.6,r);}ctx.stroke();ctx.restore();}
  }
  for(const p of G.parts){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.col;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);}ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const t of G.texts){ctx.globalAlpha=Math.min(1,t.life/t.max*2);ctx.font='900 '+(t.big?18:13)+'px system-ui,sans-serif';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.strokeText(t.s,t.x,t.y);ctx.fillStyle=t.col;ctx.fillText(t.s,t.x,t.y);}ctx.globalAlpha=1;
  ctx.restore();
  if(G.flash>0){const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'rgba(255,0,0,0)');g.addColorStop(1,'rgba(255,0,0,'+(G.flash*.7)+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
}
function drawRange(x,y,r){ctx.fillStyle='rgba(255,255,255,.12)';ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1.5;ctx.setLineDash([5,4]);ctx.beginPath();ctx.arc(OX+x*T,OY+y*T,r*T,0,7);ctx.fill();ctx.stroke();ctx.setLineDash([]);}
function drawEnemy(e){
  const d=e.def,s=T*d.size*2;let x=OX+e.x*T,y=OY+e.y*T;
  if(d.air)y+=Math.sin(e.wob)*T*.08-T*.12;else if(e.t==='fly'){x+=Math.sin(e.wob*1.7)*T*.06;y+=Math.cos(e.wob*1.3)*T*.06;}else y+=Math.abs(Math.sin(e.wob*.6))*-T*.05;
  ctx.fillStyle='rgba(0,0,0,'+(d.air?.15:.25)+')';ctx.beginPath();ctx.ellipse(OX+e.x*T,OY+e.y*T+s*.35,s*.35,s*.12,0,0,7);ctx.fill();
  if(e.slowF<1){ctx.fillStyle='rgba(100,190,255,.35)';ctx.beginPath();ctx.arc(x,y,s*.5,0,7);ctx.fill();}
  if(e.t==='cocky')drawCocky(x,y,s*.55,e.wob,e.face||1,e.hit>0);
  else{drawEmo(d.emoji,x,y,s*.85,(e.face||1)>0);if(e.hit>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.4;drawEmo(d.emoji,x,y,s*.85,(e.face||1)>0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}}
  if(d.boss){ctx.fillStyle='#ffd54f';drawEmo('👑',x,y-s*.55,s*.35);}
  if(e.hp<e.max){const bw=Math.max(T*.6,s*.7),bh=d.boss?5:3.5,bx=x-bw/2,by=y-s*.55-(d.boss?10:4);ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(bx-1,by-1,bw+2,bh+2);const f=Math.max(0,e.hp/e.max);ctx.fillStyle=f>.5?'#76ff03':f>.25?'#ffc400':'#ff3d00';ctx.fillRect(bx,by,bw*f,bh);}
}

// ---------- HUD / bar ----------
function updHud(){$('lives').textContent=G.lives;$('money').textContent=G.money;$('wave').textContent=G.wave+'/'+TOTAL_WAVES;hudDirty=false;}
function stats(type,lv){const L=TOWERS[type].lv[lv];let s='Dmg '+L.dmg+' · Rng '+L.range.toFixed(1);if(L.slow)s+=' · Slow '+Math.round((1-L.slow)*100)+'%';else s+=' · '+(1/L.rate).toFixed(1)+'/s';return s;}
function renderBar(){
  barDirty=false;lastMoney=G.money;

    const tw=sel.tw,def=TOWERS[tw.type],maxed=tw.lv>=2,uc=maxed?0:def.up[tw.lv],sv=Math.floor(tw.spent*.7);

      (maxed?'<br><i>Fully upgraded!</i>':'<br><span style="color:#c5e1a5">Next: '+stats(tw.type,tw.lv+1)+'</span>')+'</div>'+
      (maxed?'':'<button class="ab g'+(G.money<uc?' dis':'')+'" data-a="up">⬆ $'+uc+'</button>')+
      '<button class="ab r" data-a="sell">Sell $'+sv+'</button><button class="ab n" data-a="close">✕</button></div>'+

  }
  let h='<div class="row">';
  for(const k of TORDER){const d=TOWERS[k];h+='<button class="tb'+(G.armed===k?' armed':'')+(G.money<d.cost?' dis':'')+'" data-t="'+k+'"><img class="ic" src="'+ICONS[k]+'" alt="">'+d.name.replace('Farmer Jesse','Farmer').replace('Net Scarecrow','Scarecrow')+'<span class="c">$'+d.cost+'</span></button>';}
  h+='</div><div class="hint">'+(sel&&sel.kind==='spot'?'Pick a tower to build here':(G.armed?TOWERS[G.armed].desc+' Tap a grass spot to build.':'Tap a grass spot or a tower to build · tap towers to upgrade'))+'</div>';
  bar.innerHTML=h;
}
bar.addEventListener('pointerdown',ev=>{
  const b=ev.target.closest('button');if(!b||!G||G.over)return;ev.preventDefault();audioInit();
  if(b.dataset.t){const k=b.dataset.t;
    if(G.sel&&G.sel.kind==='spot'){build(k,G.sel.c,G.sel.r);}
    else{G.armed=G.armed===k?null:k;barDirty=true;}
    return;}
  const a=b.dataset.a,tw=G.sel&&G.sel.tw;
  if(a==='close'){G.sel=null;barDirty=true;}
  else if(a==='up'&&tw){const def=TOWERS[tw.type];if(tw.lv<2&&G.money>=def.up[tw.lv]){G.money-=def.up[tw.lv];tw.spent+=def.up[tw.lv];tw.lv++;sfx('up');addPart(OX+tw.x*T,OY+tw.y*T,20,'#ffd54f',90,3,.6);addText(OX+tw.x*T,OY+tw.y*T-T*.5,'Level '+(tw.lv+1)+'!','#ffd54f');hudDirty=barDirty=true;}else sfx('err');}
  else if(a==='sell'&&tw){const v=Math.floor(tw.spent*.7);G.money+=v;G.towers.splice(G.towers.indexOf(tw),1);sfx('sell');addText(OX+tw.x*T,OY+tw.y*T,'+$'+v);addPart(OX+tw.x*T,OY+tw.y*T,14,'#a1887f',70,3,.5);G.sel=null;hudDirty=barDirty=true;}
});
function build(k,c,r){
  const d=TOWERS[k];if(G.money<d.cost){sfx('err');addText(OX+(c+.5)*T,OY+(r+.5)*T,'Need $'+d.cost,'#ff8a80');return false;}
  G.money-=d.cost;G.towers.push({type:k,c,r,x:c+.5,y:r+.5,lv:0,cd:0,ang:-1.57,anim:0,spin:0,spent:d.cost});
  sfx('build');addPart(OX+(c+.5)*T,OY+(r+.5)*T,16,'#d7ccc8',80,3,.5);G.sel=null;hudDirty=barDirty=true;return true;
}
cv.addEventListener('pointerdown',ev=>{
  ev.preventDefault();if(!G||G.over)return;audioInit();
  const rc=cv.getBoundingClientRect(),x=ev.clientX-rc.left,y=ev.clientY-rc.top;
  const c=Math.floor((x-OX)/T),r=Math.floor((y-OY)/T);
  const tw=G.towers.find(t=>t.c===c&&t.r===r);
  if(tw){G.sel=(G.sel&&G.sel.tw===tw)?null:{kind:'tower',tw};G.armed=null;barDirty=true;return;}
  if(c>=0&&c<COLS&&r>=0&&r<ROWS&&grid[r][c]===0){
    if(G.armed){build(G.armed,c,r);return;}
    G.sel=(G.sel&&G.sel.kind==='spot'&&G.sel.c===c&&G.sel.r===r)?null:{kind:'spot',c,r};barDirty=true;return;
  }
  if(G.sel||G.armed){G.sel=null;G.armed=null;barDirty=true;}
});
goBtn.addEventListener('pointerdown',ev=>{ev.preventDefault();audioInit();startWave();});
$('bSpeed').addEventListener('pointerdown',ev=>{ev.preventDefault();if(!G)return;G.speed=G.speed===1?2:1;ev.currentTarget.textContent=G.speed+'×';ev.currentTarget.classList.toggle('on',G.speed===2);});
$('bMute').addEventListener('pointerdown',ev=>{ev.preventDefault();muted=!muted;try{localStorage.setItem('od_mute',muted?'1':'0')}catch(e){}ev.currentTarget.textContent=muted?'🔇':'🔊';if(!muted){audioInit();sfx('coin');}});
$('bPause').addEventListener('pointerdown',ev=>{ev.preventDefault();if(!G||G.over)return;setPause(!G.paused);});
function setPause(p){if(!G||G.over)return;G.paused=p;$('bPause').textContent=p?'▶':'⏸';
  if(p)showOv('<h2>⏸ Paused</h2><p>Wave '+G.wave+'/'+TOTAL_WAVES+' · 🥭 '+G.lives+' · 💰 '+G.money+'</p><button class="bb" data-o="resume">▶ Resume</button><button class="bb alt" data-o="restart">↻ Restart</button>');
  else hideOv();}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&!G.over&&G.running&&!G.paused&&!ov.classList.contains('show'))setPause(true);});

// ---------- overlays ----------
function showOv(h){ov.innerHTML='<div class="card">'+h+'</div>';ov.classList.remove('hide');}
function hideOv(){ov.classList.add('hide');}
ov.addEventListener('pointerdown',ev=>{const b=ev.target.closest('button');if(!b)return;ev.preventDefault();audioInit();const o=b.dataset.o;
  if(o==='play'||o==='restart'){newGame();hideOv();$('bPause').textContent='⏸';$('bSpeed').textContent='1×';$('bSpeed').classList.remove('on');}
  else if(o==='resume')setPause(false);});
function bestLine(){return best.wave?'<p class="best">🏆 Best: '+(best.won?'Orchard saved!':'wave '+best.wave)+' · '+best.score+' pts</p>':'';}
const li=k=>'<img src="'+ICONS[k]+'" style="width:20px;height:20px;vertical-align:middle;margin-right:2px">';
function titleScreen(){
  showOv('<div class="big">🥭</div><h1>Orchard Defence</h1><p>The pests are coming for the Strathdickie mangoes! Build defences beside the track and stop them reaching the trees.</p>'+
  '<div class="legend"><div>'+li('farmer')+'<b>Farmer</b> – shotgun, hits all</div><div>'+li('sprinkler')+'<b>Sprinkler</b> – slows ground pests</div><div>'+li('scare')+'<b>Scarecrow</b> – nets, flyers only</div><div>'+li('spray')+'<b>Spray Rig</b> – area, ground only</div>'+
  '<div>🪰 Fruit flies (fast)</div><div>🦇 Flying foxes (air)</div><div>🐦 Cockatoos (air)</div><div>🐗 Wild pigs (tough)</div></div>'+
  '<p style="font-size:12.5px">Tap a grass square, then pick a tower. Tap a tower to upgrade or sell. Survive 15 waves – watch out for Big Tusker!</p>'+bestLine()+'<button class="bb" data-o="play">▶ Play</button>');
}
function endGame(won){
  if(G.over)return;G.over=true;G.running=false;G.sel=null;barDirty=true;
  if(won)G.score+=G.lives*100+G.money;
  const wave=won?TOTAL_WAVES:G.wave;let nb=false;
  if(!best.score||G.score>best.score){best.score=G.score;nb=true;}
  if(!best.wave||wave>best.wave)best.wave=wave;if(won)best.won=true;
  try{localStorage.setItem('od_best',JSON.stringify(best))}catch(e){}
  updateGo();sfx(won?'win':'lose');
  setTimeout(()=>showOv(won?
    '<div class="big">🏆🥭</div><h2>Orchard Saved!</h2><p>You saw off all 15 waves, Big Tusker included. The mangoes are safe for another season.</p><p><b>Score: '+G.score+'</b> · 🥭 '+G.lives+' left · '+G.kills+' pests</p>'+(nb?'<p class="best">New best score!</p>':bestLine())+'<button class="bb" data-o="restart">↻ Play again</button>'
   :'<div class="big">🐗💥</div><h2>The pests got the mangoes!</h2><p>You held out until wave '+G.wave+' of '+TOTAL_WAVES+'.</p><p><b>Score: '+G.score+'</b> · '+G.kills+' pests stopped</p>'+(nb?'<p class="best">New best score!</p>':bestLine())+'<button class="bb" data-o="restart">↻ Try again</button>'),won?900:700);
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;if(dt<0)dt=0;
  if(G&&!G.paused&&!G.over){for(let i=0;i<G.speed;i++)update(dt);}
  else if(G&&G.over){for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}G.parts=G.parts.filter(p=>p.life>0);}
  if(bannerT>0){bannerT-=dt;if(bannerT<=0)banner.style.opacity=0;}
  if(G){if(hudDirty)updHud();if(barDirty||lastMoney!==G.money)renderBar();render();}
  requestAnimationFrame(frame);
}
// prevent scroll / zoom
['touchmove','gesturestart','dblclick'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,200));
$('bMute').textContent=muted?'🔇':'🔊';
resize();newGame();titleScreen();requestAnimationFrame(frame);
window.__od={get G(){return G},startWave,build,layout:()=>({T,OX,OY,W,H}),ff:s=>{for(let i=0;i<s*60&&!G.over;i++)update(1/60);}};
// PWA (only when served over http/https; file:// stays standalone)
if(/^https?:$/.test(location.protocol)){
  const l=document.createElement('link');l.rel='manifest';l.href='manifest.json';document.head.appendChild(l);
  const a=document.createElement('link');a.rel='apple-touch-icon';a.href='icon-192.png';document.head.appendChild(a);
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
})();
</script>
</body>
</html>
