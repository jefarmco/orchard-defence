<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#24451a;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;color:#fff}
button{font-family:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#hud{display:flex;align-items:center;gap:5px;padding:6px 7px;padding-top:calc(6px + env(safe-area-inset-top));background:linear-gradient(#3b2a17,#2b1e10);border-bottom:2px solid #6b4a24;font-weight:800;font-size:15px}
.stat{display:flex;align-items:center;gap:3px;background:rgba(0,0,0,.3);border-radius:10px;padding:5px 7px;white-space:nowrap}
.stat.bump{animation:bump .35s}

#hud .sp{flex:1}
.hb{border:0;border-radius:10px;background:#6b4a24;color:#fff;font-size:16px;font-weight:800;min-width:38px;height:35px;padding:0 7px;box-shadow:0 2px 0 #3b2a12}
.hb:active{transform:translateY(2px);box-shadow:none}
.hb.on{background:#e8a317;color:#3b2a12}
#wrap{flex:1;position:relative;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#prev{position:absolute;left:6px;top:6px;background:rgba(30,20,8,.72);border:1px solid rgba(255,213,79,.4);border-radius:10px;padding:3px 7px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:4px;pointer-events:none;max-width:calc(100% - 12px);flex-wrap:wrap}
#prev img{width:20px;height:20px;vertical-align:middle}
#prev .g{display:inline-flex;align-items:center;gap:1px}
#go{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);border:0;border-radius:24px;padding:12px 22px;font-size:18px;font-weight:900;color:#3b2a12;background:linear-gradient(#ffd54f,#f9a825);box-shadow:0 4px 0 #a16207,0 6px 14px rgba(0,0,0,.4);white-space:nowrap;animation:pulse 1.4s infinite;z-index:2}
#go:active{transform:translateX(-50%) translateY(3px);box-shadow:0 1px 0 #a16207}
#go.early{background:linear-gradient(#aed581,#7cb342);box-shadow:0 4px 0 #33691e;animation:none;font-size:15px;padding:9px 16px}
@keyframes pulse{50%{filter:brightness(1.15)}}
.tut{animation:tut 1s infinite!important;outline:3px solid #fff;outline-offset:2px}
@keyframes tut{50%{outline-color:#ffd54f;filter:brightness(1.3)}}
#tip{position:absolute;left:50%;transform:translateX(-50%);background:#fff8e1;color:#3b2a12;font-weight:800;font-size:14px;padding:8px 12px;border-radius:12px;border:2px solid #a16207;box-shadow:0 4px 12px rgba(0,0,0,.4);pointer-events:none;z-index:3;max-width:88%;text-align:center;display:none}
#banner{position:absolute;left:0;right:0;top:32%;text-align:center;font-size:30px;font-weight:900;text-shadow:0 3px 0 #000,0 0 18px #000;pointer-events:none;opacity:0;transition:opacity .3s,transform .3s;transform:scale(.8);z-index:2}
#banner.show{opacity:1;transform:scale(1)}
#banner small{display:block;font-size:15px;font-weight:700;margin-top:4px}
#bar{background:linear-gradient(#3b2a17,#24180c);border-top:2px solid #6b4a24;padding:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom));height:calc(124px + env(safe-area-inset-bottom))}
#bar .row{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tb{border:2px solid #6b4a24;border-radius:11px;background:#5a3d1e;color:#fff;padding:2px 3px;display:flex;align-items:center;gap:2px;font-weight:800;font-size:10px;min-width:0;line-height:1.15;height:46px;text-align:left;letter-spacing:-.2px}
.tb img{width:28px;height:28px;pointer-events:none;flex:none}
.tb span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;pointer-events:none}
.tb .c{display:block;color:#ffd54f;font-size:13px}
#abil{position:absolute;right:6px;bottom:64px;display:flex;flex-direction:column;gap:8px;z-index:2}
.ah{position:relative;width:50px;height:50px;border-radius:50%;border:3px solid #ffd54f;background:#5a3d1e;padding:0;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.5);overflow:hidden}
.ah img{width:100%;height:100%;pointer-events:none}
.ah .cd{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.ah .lb{position:absolute;left:0;right:0;bottom:1px;font-size:9.5px;font-weight:900;text-shadow:0 1px 2px #000;pointer-events:none}
.ah.ready{animation:ready 1.2s infinite}
@keyframes ready{50%{box-shadow:0 0 0 4px rgba(255,213,79,.6),0 3px 8px rgba(0,0,0,.5)}}
.ah.sel{border-color:#fff;box-shadow:0 0 0 3px #43a047}
.xp{height:6px;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden;margin-top:3px}.xp i{display:block;height:100%;background:#ffd54f}
.tb.armed{border-color:#ffd54f;background:#7a5426;box-shadow:0 0 0 2px #ffd54f inset}
.tb.dis{opacity:.45;filter:grayscale(.6)}
.tb:active{transform:scale(.95)}
.hint{text-align:center;font-size:12px;opacity:.85;margin-top:5px;height:15px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.up{display:flex;align-items:center;gap:6px;min-height:46px}
.up img{width:44px;height:44px;flex:none}
.up .info{flex:1;min-width:0;font-size:12px;line-height:1.3}

.btns{display:flex;gap:5px;margin-top:6px}
.ab{border:0;border-radius:11px;padding:6px 6px;font-weight:900;font-size:13px;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.4);flex:1;min-width:0;line-height:1.15;height:46px}

.ab.g{background:#43a047}.ab.p{background:#7e57c2}.ab.r{background:#c62828;flex:.7}.ab.n{background:#6b4a24;flex:.35}
.ab.dis{opacity:.45}
#ov{position:absolute;inset:0;background:rgba(15,25,8,.84);display:flex;align-items:center;justify-content:center;z-index:5;padding:14px;overflow-y:auto}
#ov.hide{display:none}
.card{background:linear-gradient(#fff8e1,#ffe9b0);color:#3b2a12;border-radius:20px;padding:18px 16px;max-width:390px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);border:3px solid #a16207;margin:auto;animation:pop .3s}

.card h2{margin:0 0 6px;font-size:25px}
.card h3{margin:10px 0 6px;font-size:15px;text-align:left}
.card p{margin:7px 0;font-size:14px;line-height:1.4}
.card .logo{width:96px;height:96px}
.bb{display:block;width:100%;border:0;border-radius:16px;padding:13px;margin-top:10px;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(#66bb6a,#2e7d32);box-shadow:0 4px 0 #1b5e20}
.bb.alt{background:linear-gradient(#a1887f,#6d4c41);box-shadow:0 4px 0 #3e2723;font-size:16px;padding:10px}
.bb.gold{background:linear-gradient(#ffd54f,#f9a825);color:#3b2a12;box-shadow:0 4px 0 #a16207}
.bb:active{transform:translateY(3px);box-shadow:none}
.maps{display:flex;flex-direction:column;gap:6px}
.mp{display:flex;align-items:center;gap:8px;border:2px solid #c9a35a;border-radius:12px;background:#fff3cf;padding:5px 8px;text-align:left;color:#3b2a12;width:100%}
.mp img{width:60px;height:72px;border-radius:7px;flex:none;border:1px solid #a16207}
.mp.sel{border-color:#2e7d32;background:#e7f5d5;box-shadow:0 0 0 2px #2e7d32 inset}
.mp.lock{opacity:.55;filter:grayscale(.8)}
.mp b{font-size:15px}.mp div{font-size:12px;line-height:1.3}
.st{color:#f9a825;font-size:15px;letter-spacing:1px}
.diff{display:flex;gap:6px}
.diff button{flex:1;border:2px solid #c9a35a;border-radius:11px;background:#fff3cf;padding:8px 2px;font-weight:900;font-size:14px;color:#3b2a12}
.diff button.sel{background:#2e7d32;color:#fff;border-color:#1b5e20}
.diff small{display:block;font-weight:600;font-size:10.5px}
.stars{font-size:52px;letter-spacing:4px;margin:4px 0}
.stars span{color:#f9a825;text-shadow:0 2px 0 #a16207;display:inline-block;opacity:.2;filter:grayscale(1);transform:scale(.5)}
.stars span.on{animation:star .5s forwards}
@keyframes star{0%{opacity:0;transform:scale(2.4) rotate(-40deg)}70%{opacity:1;transform:scale(.9)}100%{opacity:1;filter:none;transform:scale(1)}}
.best{font-weight:800;color:#a16207}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;text-align:left;font-size:12px;margin:8px 0;background:rgba(161,98,7,.12);border-radius:10px;padding:7px}
.legend img{width:22px;height:22px;vertical-align:middle;margin-right:2px}
.row2{display:flex;gap:8px}.row2 .bb{flex:1}
</style>
</head>

function withCanvas(S,fn){const sv=[ctx,OX,OY,T];const c=document.createElement('canvas');c.width=c.height=Math.round(S*DPR);ctx=c.getContext('2d');ctx.scale(DPR,DPR);fn(S);const u=c.toDataURL();[ctx,OX,OY,T]=sv;return u;}
function makeIcons(){
  for(const k of TORDER){ICONS[k]=withCanvas(44,S=>drawTowerSprite({type:k,lv:-1,br:0,ang:-.7,anim:0,spin:.4},S/2,S*.53,S*.42,true));}
  for(const k in ENEMIES){EICONS[k]=withCanvas(32,S=>drawEnemySprite(k,S/2,S*.58,S*.34,.6,1,false));}
  HEROICON=withCanvas(54,S=>{ctx.fillStyle='#8d6e3c';ctx.fillRect(0,0,S,S);heroSprite(S/2,S*.6,S*.55,0,false,1,-.4,0);});
  EICONS.smoko=withCanvas(54,S=>{ctx.fillStyle='#6d4c41';ctx.fillRect(0,0,S,S);ctx.fillStyle='#fafafa';rr(ctx,S*.25,S*.3,S*.38,S*.42,S*.06);ctx.fill();ctx.strokeStyle='#fafafa';ctx.lineWidth=S*.07;ctx.beginPath();ctx.arc(S*.66,S*.5,S*.09,-1.5,1.5);ctx.stroke();ctx.fillStyle='#5d4037';ctx.fillRect(S*.29,S*.34,S*.3,S*.08);
    ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=S*.04;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(S*(.33+i*.1),S*.25);ctx.quadraticCurveTo(S*(.29+i*.1),S*.17,S*(.35+i*.1),S*.08);ctx.stroke();}});
  EICONS.ute=withCanvas(54,S=>{ctx.fillStyle='#455a64';ctx.fillRect(0,0,S,S);uteSprite(S/2,S*.55,S*.42,1);});
}
function uteSprite(x,y,s,face){ctx.save();ctx.translate(x,y);ctx.scale(face,1);ctx.fillStyle='#fafafa';rr(ctx,-s,-s*.2,s*2,s*.5,s*.1);ctx.fill();ctx.fillStyle='#e0e0e0';rr(ctx,-s*.1,-s*.55,s*.75,s*.4,s*.12);ctx.fill();ctx.fillStyle='#4fc3f7';ctx.fillRect(s*.05,-s*.48,s*.5,s*.25);
  ctx.fillStyle='#c62828';ctx.fillRect(-s,-s*.05,s*2,s*.08);ctx.fillStyle='#424242';ctx.fillRect(s*.85,-s*.05,s*.2,s*.25);O(-s*.6,s*.32,s*.24,'#212121');O(s*.6,s*.32,s*.24,'#212121');O(-s*.6,s*.32,s*.1,'#9e9e9e');O(s*.6,s*.32,s*.1,'#9e9e9e');O(s*.95,-s*.05,s*.07,'#fff59d');ctx.restore();}
// ---------- waves ----------
function waveGroups(w){return WAVES[w-1].map(g=>g[0]==='BOSS'?[G.map===0?'boss':'croc',...g.slice(1)]:g);}
function startWave(){
  if(!G||G.over||G.wave>=TOTAL_WAVES||G.spawning)return;
  if(G.enemies.length>0&&G.wave>0){const b=10+G.wave*2;G.money+=b;addText(W/2,H*.42,'+$'+b+' early call!','#c5e1a5',1);}
  G.wave++;G.running=true;G.spawning=true;G.waveTime=0;
  const m=hpMul(G.wave)*G.D.hp*MAP.mult,groups=waveGroups(G.wave);
  for(const [t,n,gap,at,bm] of groups)for(let i=0;i<n;i++)G.spawnQ.push({t,at:at+i*gap,hp:ENEMIES[t].hp*m*(bm||1)});
  G.spawnQ.sort((a,b)=>a.at-b.at);
  const boss=groups.find(g=>ENEMIES[g[0]].boss);
  if(boss){showBanner('⚠ '+ENEMIES[boss[0]].name.toUpperCase()+' INCOMING!','Boss wave '+G.wave);sfx('boss');vib([90,50,90,50,160]);G.shake=.6;}
  else{showBanner(G.wave===TOTAL_WAVES?'Final wave!':'Wave '+G.wave,groups.map(g=>g[1]+' '+ENEMIES[g[0]].name+(g[1]>1?'s':'')).join(' · '));sfx('wave');}
  if(tut===2)tutStep(3);
  hudDirty=true;updateGo();updatePreview();
}
function spawn(q,pi,d){const def=ENEMIES[q.t];G.spawnN++;
  const e={t:q.t,def,hp:q.hp,max:q.hp,d:d!=null?d:-Math.random()*.3,pi:pi!=null?pi:(G.spawnN%PATHS.length),speed:def.speed*(.92+Math.random()*.16),slowF:1,slowT:0,stunT:0,poisonT:0,poisonDps:0,hit:0,wob:Math.random()*6.28,off:def.boss?0:(Math.random()-.5)*.4,x:0,y:0,face:1,ramT:0,ramCd:1+Math.random()*2,sprintT:0,sprintCd:0,dmgAcc:0,dmgT:0};
  const p=posAt(e.pi,e.d);e.x=p.x;e.y=p.y;G.enemies.push(e);return e;}
let bannerT=0;
function showBanner(t,sub){banner.innerHTML=t+(sub?'<small>'+sub+'</small>':'');banner.classList.add('show');bannerT=2.2;}
function updateGo(){
  if(!G||G.over||G.wave>=TOTAL_WAVES||G.spawning){goBtn.style.display='none';return;}
  goBtn.style.display='block';
  if(G.enemies.length>0&&G.wave>0){goBtn.className='early';goBtn.textContent='⏩ Wave '+(G.wave+1)+' early (+$'+(10+G.wave*2)+')';}
  else{goBtn.className='';goBtn.textContent='▶ Start Wave '+(G.wave+1);}
  if(tut===2)goBtn.classList.add('tut');
}
function updatePreview(){
  if(!G){prevEl.style.display='none';return;}prevEl.style.display='flex';
  if(G.spawning||G.wave>=TOTAL_WAVES){const n=G.enemies.length+G.spawnQ.length;prevEl.innerHTML='Wave '+G.wave+' · '+n+' pests left';return;}
  const groups=waveGroups(G.wave+1),agg={};for(const g of groups)agg[g[0]]=(agg[g[0]]||0)+g[1];
  prevEl.innerHTML='Next:'+Object.keys(agg).map(k=>'<span class="g"><img src="'+EICONS[k]+'" alt="">×'+agg[k]+'</span>').join('');
}
// ---------- effects ----------
function addPart(x,y,n,col,spd,size,life,grav,drag){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=(spd||60)*(.3+Math.random());G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:(life||.5)*(.6+Math.random()*.6),max:life||.5,col,size:size||2.5,g:grav||0,dr:drag==null?.96:drag});}if(G.parts.length>700)G.parts.splice(0,G.parts.length-700);}
function addText(x,y,s,col,big){G.texts.push({x,y,s,col:col||'#ffd54f',life:big?1.5:.8,max:big?1.5:.8,big:big||0,vx:(Math.random()-.5)*20});if(G.texts.length>80)G.texts.shift();}
function ring(x,y,max,col,life,w){G.rings.push({x,y,r:0,max,col,life:life||.45,ml:life||.45,w:w||.18});}
const DEATHCOL={fly:['#8d3b1f','#fdd835'],hare:['#b08d57','#fff'],toad:['#8a7a3a','#c9b26b'],cocky:['#fff','#fdd835'],crow:['#111','#444'],bat:['#4e342e','#d1793a'],camp:['#4e342e','#d1793a'],beetle:['#1f5f55','#9fe0d0'],goat:['#cfc6b8','#fff'],emu:['#5c4a3a','#3f6f8f'],brumby:['#8d5a3b','#2b1a10'],pig:['#5d4037','#d7a08a'],boss:['#3e2723','#ffd54f'],croc:['#3c6626','#ffd54f']};
// ---------- combat ----------
function inR(ax,ay,bx,by,r){const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy<=r*r;}
function damage(e,dmg,o){if(e.hp<=0)return;o=o||{};
  if(e.def.armor&&!o.pierce)dmg=Math.max(dmg*.3,dmg-e.def.armor);
  e.hp-=dmg;e.hit=.08;e.dmgAcc+=dmg;
  if(e.def.sprint&&e.sprintCd<=0){e.sprintT=.9;e.sprintCd=2.2;}
  if(e.hp<=0)kill(e,o.src);}
function kill(e,src){
  const px=OX+e.x*T,py=OY+e.y*T,d=e.def,rw=Math.max(1,Math.round(d.reward*G.D.reward));
  G.money+=rw;G.score+=rw*10;G.kills++;hudDirty=true;
  if(e.dmgAcc>=1)flushDmg(e);
  addText(px,py-T*.35,'+$'+rw,'#ffd54f');
  const cl=DEATHCOL[e.t]||['#888','#ccc'];addPart(px,py,d.boss?50:12,cl[0],d.boss?170:80,d.boss?4.5:3,.6,d.air?40:0);addPart(px,py,d.boss?30:5,cl[1],d.boss?120:60,2.5,.5);
  ring(e.x,e.y,d.boss?2:.6,'rgba(255,255,255,',.3,.08);
  G.corpses.push({t:e.t,x:e.x,y:e.y,face:e.face,life:.4,s:d.size,a:e.wob});
  if(d.split){for(let i=0;i<d.split;i++){const b=spawn({t:'bat',hp:ENEMIES.bat.hp*hpMul(G.wave)*G.D.hp*MAP.mult*.6},e.pi,e.d-i*.25);b.off=(i-1)*.3;}}
  if(d.boss){G.shake=.8;addPart(px,py,40,'#ffd54f',220,3.5,1);vib([60,40,120]);sfx('boom');}
  else sfx(d.air?(e.t==='cocky'||e.t==='crow'?'squawk':'pop'):(e.t==='pig'?'oink':'pop'));
  if(rw>=8)sfx('coin');
  heroXp(rw*(src==='hero'?2:1));
}
function flushDmg(e){const a=Math.round(e.dmgAcc);if(a>=1){const big=a>=80;G.texts.push({x:OX+e.x*T+(Math.random()-.5)*T*.4,y:OY+e.y*T-T*.25,s:''+a,col:big?'#ff9100':'#fff',life:.6,max:.6,big:0,small:!big,vx:(Math.random()-.5)*30});if(G.texts.length>90)G.texts.shift();}e.dmgAcc=0;e.dmgT=.3;}
function heroXp(x){const h=G.hero;if(h.lv>=HERO.maxLv)return;h.xp+=x;while(h.lv<HERO.maxLv&&h.xp>=HERO.xpNeed(h.lv)){h.xp-=HERO.xpNeed(h.lv);h.lv++;addText(OX+h.x*T,OY+h.y*T-T*.8,'Jesse Lv '+h.lv+'!','#69f0ae',1);ring(h.x,h.y,1.4,'rgba(105,240,174,',.6,.15);addPart(OX+h.x*T,OY+h.y*T,24,'#69f0ae',110,3,.7);sfx('lvl');vib(40);}if(G.sel&&G.sel.kind==='hero')barDirty=true;renderAbil();}
function findTarget(x,y,r,air,ground,exclude){let best=null;for(const e of G.enemies){if(e.hp<=0||(exclude&&exclude.includes(e)))continue;if(e.def.air?!air:!ground)continue;if(inR(e.x,e.y,x,y,r)&&(!best||e.d+(e.pi?0:0)>best.d))best=e;}return best;}
function buffs(tw){let rm=1,dm=1;const h=G.hero;if(inR(h.x,h.y,tw.x,tw.y,HERO.auraR))rm*=1+HERO.aura(h.lv);if(h.smokoT>0){rm*=1.5;dm*=1.5;}tw.buffed=rm>1;return [rm,dm];}
function useSmoko(){const h=G.hero;if(!G||G.over||h.smokoCd>0)return;h.smokoT=HERO.smokoDur;h.smokoCd=HERO.smokoCd;sfx('smoko');vib(30);showBanner('☕ SMOKO!','All towers +50% for '+HERO.smokoDur+'s');for(const tw of G.towers)ring(tw.x,tw.y,.9,'rgba(255,213,79,',.6,.12);renderAbil();}
function useUte(){const h=G.hero;if(!G||G.over||h.uteCd>0)return;h.uteCd=HERO.uteCd;G.uteN=(G.uteN||0)+1;const pi=G.uteN%PATHS.length;G.ute={pi,d:PATHS[pi].len,hit:new Set(),dmg:HERO.uteDmg(h.lv)};sfx('ute');vib([30,30,30]);G.shake=.3;renderAbil();}
function update(dt){
  G.time+=dt;G.beams.length=0;
  if(G.spawning){G.waveTime+=dt;while(G.spawnQ.length&&G.spawnQ[0].at<=G.waveTime)spawn(G.spawnQ.shift());if(!G.spawnQ.length){G.spawning=false;updateGo();updatePreview();}}
  // enemies
  for(const e of G.enemies){if(e.hp<=0)continue;
    if(e.slowT>0){e.slowT-=dt;if(e.slowT<=0)e.slowF=1;}
    if(e.poisonT>0){e.poisonT-=dt;damage(e,e.poisonDps*dt,{pierce:true});if(Math.random()<dt*8)G.parts.push({x:OX+e.x*T+(Math.random()-.5)*T*.3,y:OY+e.y*T,vx:0,vy:-25,life:.5,max:.5,col:'#9ccc65',size:3,g:0,dr:.96});if(e.hp<=0)continue;}
    if(e.def.ram){e.ramCd-=dt;if(e.ramCd<=0){e.ramT=.6;e.ramCd=2.6+Math.random()*1.5;addPart(OX+e.x*T,OY+e.y*T+T*.2,5,'#bfa57a',40,2.5,.4);}}
    if(e.ramT>0)e.ramT-=dt;if(e.sprintT>0)e.sprintT-=dt;if(e.sprintCd>0)e.sprintCd-=dt;if(e.hit>0)e.hit-=dt;
    if(e.dmgT>0)e.dmgT-=dt;else if(e.dmgAcc>=1)flushDmg(e);
    let sp=e.speed*e.slowF*(e.ramT>0?3:1)*(e.sprintT>0?2.2:1);if(e.stunT>0){e.stunT-=dt;sp=0;}
    e.d+=sp*dt;e.wob+=dt*(e.def.air?6:8)*(sp>0?1:.2);
    const p=posAt(e.pi,e.d);e.x=p.x+(p.dx?0:e.off);e.y=p.y+(p.dx?e.off:0);if(p.dx)e.face=p.dx;
    if(e.d>=PATHS[e.pi].len){e.hp=0;G.leaks[e.t]=(G.leaks[e.t]||0)+1;G.lives-=e.def.dmg;G.flash=.5;G.shake=Math.max(G.shake,.25);hudDirty=true;sfx('leak');vib(e.def.boss?300:60);bumpLives();
      addText(OX+e.x*T,OY+e.y*T-T*.4,'-'+e.def.dmg+' mango'+(e.def.dmg>1?'es':''),'#ff8a80',1);
      if(e.def.steal&&G.money>0){const s=Math.min(G.money,e.def.steal);G.money-=s;addText(OX+e.x*T,OY+e.y*T-T*.9,'Crow stole $'+s+'!','#ff5252',1);sfx('steal');}
      if(G.lives<=0){G.lives=0;endGame(false);return;}}
  }
  // hero
  const h=G.hero;if(h.smokoT>0)h.smokoT-=dt;
  const pc=h.smokoCd>0||h.uteCd>0;if(h.smokoCd>0)h.smokoCd=Math.max(0,h.smokoCd-dt);if(h.uteCd>0)h.uteCd=Math.max(0,h.uteCd-dt);if(pc&&(G.time%.25<dt))renderAbil();
  {const dx=h.tx-h.x,dy=h.ty-h.y,dd=Math.hypot(dx,dy);if(dd>.05){const st=Math.min(dd,HERO.spd*dt);h.x+=dx/dd*st;h.y+=dy/dd*st;h.walk=1;h.anim+=dt*4;if(Math.abs(dx)>.05)h.face=Math.sign(dx);}else h.walk=0;
   h.cd-=dt;if(h.shoot>0)h.shoot-=dt;
   if(h.cd<=0){const t=findTarget(h.x,h.y,HERO.range,true,true);if(t){h.cd=HERO.rate;h.ang=Math.atan2(t.y-h.y,t.x-h.x);h.shoot=.1;damage(t,HERO.dmg(h.lv),{src:'hero'});G.shots.push({k:'pellet',x1:h.x,y1:h.y-.1,x2:t.x,y2:t.y,life:.09,ml:.09,col:'255,241,118'});addPart(OX+t.x*T,OY+t.y*T,4,'#ffe082',70,2,.25);sfx('bang');}}}
  // ute
  if(G.ute){const u=G.ute;u.d-=8*dt;const p=posAt(u.pi,u.d);u.x=p.x;u.y=p.y;u.face=-(p.dx||0)||u.face||1;
    if(Math.random()<.6)G.parts.push({x:OX+u.x*T,y:OY+u.y*T+T*.15,vx:(Math.random()-.5)*30,vy:-10,life:.6,max:.6,col:'rgba(190,160,110,.7)',size:5,g:0,dr:.95});
    for(const e of G.enemies)if(e.hp>0&&!e.def.air&&!u.hit.has(e)&&inR(e.x,e.y,u.x,u.y,.65)){u.hit.add(e);damage(e,u.dmg,{src:'hero'});e.stunT=.6;e.d=Math.max(0,e.d-(e.def.boss?.2:.8));addPart(OX+e.x*T,OY+e.y*T,8,'#fff',100,3,.4);sfx('bite');}
    if(u.d<=-1.5)G.ute=null;}
  // towers
  for(const tw of G.towers){
    const def=TOWERS[tw.type],L=tstat(tw),[rm,dm]=buffs(tw);tw.cd-=dt*rm;if(tw.anim>0)tw.anim-=dt;tw.spin=(tw.spin||0)+dt*(tw.type==='sprinkler'?3:1);
    const air=L.air!=null?L.air:def.air;
    if(tw.type==='dog'){updDogs(tw,L,dt,rm,dm);continue;}
    if(tw.type==='zapper'){updZap(tw,L,dt,rm,dm);continue;}
    if(tw.type==='drone'){updDrones(tw,L,dt);}
    if(tw.cd>0)continue;
    if(tw.type==='sprinkler'){let any=false;for(const e of G.enemies){if(e.hp>0&&(!e.def.air||air)&&inR(e.x,e.y,tw.x,tw.y,L.range)){any=true;e.slowF=Math.min(e.slowT>0?e.slowF:1,e.def.boss?Math.max(L.slow,.5):L.slow);e.slowT=.7;damage(e,L.dmg*dm);}}
      if(any){tw.cd=L.rate;for(let i=0;i<6;i++){const a=Math.random()*TAU,r=Math.random()*L.range*T;G.parts.push({x:OX+tw.x*T+Math.cos(a)*r,y:OY+tw.y*T+Math.sin(a)*r,vx:0,vy:-25,life:.45,max:.45,col:'#81d4fa',size:2.5,g:70,dr:1});}sfx('drip');}continue;}
    if(tw.type==='spray'){let any=G.enemies.some(e=>e.hp>0&&!e.def.air&&inR(e.x,e.y,tw.x,tw.y,L.range));
      if(any){tw.cd=L.rate;tw.anim=.25;ring(tw.x,tw.y,L.range,L.poison?'rgba(170,255,80,':'rgba(220,255,200,',.45,.22);
        for(const e of G.enemies)if(e.hp>0&&!e.def.air&&inR(e.x,e.y,tw.x,tw.y,L.range)){damage(e,L.dmg*dm);if(L.poison){e.poisonT=3;e.poisonDps=L.poison*dm;}}
        addPart(OX+tw.x*T,OY+tw.y*T,18,L.poison?'rgba(160,240,60,.8)':'rgba(220,255,220,.8)',L.range*T*1.7,3.5,.45,0,.93);sfx('spray');}continue;}
    if(tw.type==='farmer'){const n=L.multi||1,tg=[];for(let i=0;i<n;i++){const t=findTarget(tw.x,tw.y,L.range,true,true,tg);if(t)tg.push(t);}
      if(!tg.length)continue;tw.cd=L.rate;tw.anim=.12;tw.ang=Math.atan2(tg[0].y-tw.y,tg[0].x-tw.x);
      for(const t of tg){damage(t,L.dmg*dm,{pierce:L.pierce});G.shots.push({k:'pellet',x1:tw.x,y1:tw.y,x2:t.x,y2:t.y,life:L.pierce?.18:.09,ml:L.pierce?.18:.09,col:L.pierce?'255,120,80':'255,236,130'});addPart(OX+t.x*T,OY+t.y*T,5,'#ffe082',80,2,.25);}
      addPart(OX+(tw.x+Math.cos(tw.ang)*.45)*T,OY+(tw.y+Math.sin(tw.ang)*.45)*T,4,'rgba(200,200,200,.7)',30,3,.4,-20);sfx(L.pierce?'sniper':'bang');continue;}
    if(tw.type==='scare'){const t=findTarget(tw.x,tw.y,L.range,true,false);if(!t)continue;tw.cd=L.rate;tw.anim=.15;const hawk=tw.lv===2&&tw.br===1;
      G.shots.push({k:hawk?'hawk':'net',x:tw.x,y:tw.y-.3,tgt:t,dmg:L.dmg*dm,spd:hawk?11:8,splash:L.splash,air:true,ground:false,life:3,lx:t.x,ly:t.y,trail:[]});sfx(hawk?'squawk':'net');continue;}
    if(tw.type==='cannon'){const t=findTarget(tw.x,tw.y,L.range,false,true);if(!t)continue;tw.cd=L.rate;tw.anim=.15;tw.ang=Math.atan2(t.y-tw.y,t.x-tw.x);
      G.shots.push({k:'water',x:tw.x+Math.cos(tw.ang)*.4,y:tw.y+Math.sin(tw.ang)*.4,tgt:t,dmg:L.dmg*dm,spd:11,kb:L.kb,splash:L.splash,air:false,ground:true,life:2,lx:t.x,ly:t.y,trail:[]});sfx('water');continue;}
    if(tw.type==='drone'){const t=findTarget(tw.x,tw.y,L.range,true,true);if(!t)continue;tw.cd=L.rate;
      for(const dr of tw.drones){G.shots.push({k:'rocket',x:dr.x,y:dr.y,tgt:t,dmg:L.dmg*dm,spd:6.5,splash:L.splash,air:true,ground:true,life:3,lx:t.x,ly:t.y,trail:[],big:tw.lv===2&&tw.br===1});}sfx('rocket');continue;}
  }
  // projectiles
  for(const s of G.shots){
    if(s.k==='pellet'){s.life-=dt;continue;}
    if(s.tgt&&s.tgt.hp>0){s.lx=s.tgt.x;s.ly=s.tgt.y;}
    s.trail.push(s.x,s.y);if(s.trail.length>14)s.trail.splice(0,2);
    const dx=s.lx-s.x,dy=s.ly-s.y,dd=Math.hypot(dx,dy),sp=s.spd*dt;s.rot=(s.rot||0)+dt*10;s.ang=Math.atan2(dy,dx);

  if(abilEl.dataset.b!=='1'){abilEl.dataset.b='1';abilEl.innerHTML='<button class="ah" data-h="hero"><img src="'+HEROICON+'" alt=""><span class="lb" id="hLv">Jesse</span></button><button class="ah" data-h="smoko"><img src="'+EICONS.smoko+'" alt=""><span class="cd"></span><span class="lb">Smoko</span></button><button class="ah" data-h="ute"><img src="'+EICONS.ute+'" alt=""><span class="cd"></span><span class="lb">Ute</span></button>';}
  const h=G.hero,bs=abilEl.children;bs[0].classList.toggle('sel',!!(G.sel&&G.sel.kind==='hero'));bs[0].querySelector('.lb').textContent='Jesse '+h.lv;
  const set=(b,cd,max)=>{const f=cd/max;b.querySelector('.cd').style.background=cd>0?'conic-gradient(rgba(0,0,0,.65) '+(f*360)+'deg, rgba(0,0,0,0) 0)':'none';b.classList.toggle('ready',cd<=0);};
  set(bs[1],h.smokoCd,HERO.smokoCd);set(bs[2],h.uteCd,HERO.uteCd);
}
abilEl.addEventListener('pointerdown',ev=>{const b=ev.target.closest('button');if(!b||!G||G.over||G.paused)return;ev.preventDefault();ev.stopPropagation();audioInit();const k=b.dataset.h;
  if(k==='hero'){G.sel=G.sel&&G.sel.kind==='hero'?null:{kind:'hero'};G.armed=null;barDirty=true;sfx('tap');}
  else if(k==='smoko'){if(G.hero.smokoCd>0)sfx('err');else useSmoko();}
  else if(k==='ute'){if(G.hero.uteCd>0)sfx('err');else useUte();}
  barDirty=true;renderAbil();});
bar.addEventListener('pointerdown',ev=>{
  const b=ev.target.closest('button');if(!b||!G||G.over)return;ev.preventDefault();audioInit();
  if(b.dataset.t){const k=b.dataset.t;if(G.sel&&G.sel.kind==='spot')build(k,G.sel.c,G.sel.r);else{G.armed=G.armed===k?null:k;G.sel=null;barDirty=true;sfx('tap');}return;}
  const a=b.dataset.a,tw=G.sel&&G.sel.tw;
  if(a==='close'){G.sel=null;barDirty=true;renderAbil();}
  else if(a==='smoko')useSmoko();else if(a==='ute')useUte();
  else if(a==='up'&&tw)upgrade(tw,-1);else if(a&&a.startsWith('br')&&tw)upgrade(tw,+a[2]);
  else if(a==='sell'&&tw){const v=Math.floor(tw.spent*.7);G.money+=v;G.towers.splice(G.towers.indexOf(tw),1);sfx('sell');addText(OX+tw.x*T,OY+tw.y*T,'+$'+v);addPart(OX+tw.x*T,OY+tw.y*T,14,'#a1887f',70,3,.5);G.sel=null;hudDirty=barDirty=true;if(!G.running)saveGame();}
  barDirty=true;});
function upgrade(tw,br){const d=TOWERS[tw.type];const cost=tw.lv===0?d.up:tw.lv===1?d.br[br].cost:0;
  if(tw.lv>=2||G.money<cost||(tw.lv===1&&br<0)){sfx('err');return false;}
  G.money-=cost;tw.spent+=cost;tw.lv++;if(tw.lv===2)tw.br=br;sfx('up');vib(20);
  addPart(OX+tw.x*T,OY+tw.y*T,24,'#ffd54f',100,3,.6);ring(tw.x,tw.y,.9,'rgba(255,213,79,',.5,.15);addText(OX+tw.x*T,OY+tw.y*T-T*.5,tw.lv===2?d.br[br].name+'!':'Level 2!','#ffd54f',1);
  hudDirty=barDirty=true;if(!G.running)saveGame();return true;}
function build(k,c,r){const d=TOWERS[k];
  if(G.money<d.cost){sfx('err');addText(OX+(c+.5)*T,OY+(r+.5)*T,'Need $'+d.cost,'#ff8a80');return false;}
  if(grid[r][c]!==0||G.towers.some(t=>t.c===c&&t.r===r))return false;
  G.money-=d.cost;G.towers.push({type:k,c,r,x:c+.5,y:r+.5,lv:0,br:0,cd:0,ang:-1.57,anim:0,spin:0,spent:d.cost,dogs:[],drones:[],heat:0});
  sfx('build');vib(15);addPart(OX+(c+.5)*T,OY+(r+.5)*T,18,'#d7ccc8',90,3,.5);ring(c+.5,r+.5,.7,'rgba(255,255,255,',.35,.1);G.sel=null;G.armed=G.armed&&G.money>=d.cost?G.armed:null;hudDirty=barDirty=true;
  if(tut===1||tut===0)tutStep(2);if(!G.running)saveGame();return true;}
cv.addEventListener('pointerdown',ev=>{
  ev.preventDefault();if(!G||G.over||G.paused)return;audioInit();
  const rc=cv.getBoundingClientRect(),px=(ev.clientX-rc.left-OX)/T,py=(ev.clientY-rc.top-OY)/T,c=Math.floor(px),r=Math.floor(py);
  const tw=G.towers.find(t=>t.c===c&&t.r===r),h=G.hero;
  if(G.sel&&G.sel.kind==='hero'&&!tw){if(Math.hypot(px-h.x,py-h.y)<.5){G.sel=null;}else{h.tx=Math.max(.3,Math.min(COLS-.3,px));h.ty=Math.max(.3,Math.min(14.2,py));G.sel=null;sfx('tap');}barDirty=true;renderAbil();return;}
  if(Math.hypot(px-h.x,py-(h.y-.15))<.5&&!G.armed){G.sel={kind:'hero'};barDirty=true;renderAbil();sfx('tap');return;}
  if(tw){G.sel=(G.sel&&G.sel.tw===tw)?null:{kind:'tower',tw};G.armed=null;barDirty=true;renderAbil();return;}
  if(c>=0&&c<COLS&&r>=0&&r<ROWS&&grid[r][c]===0){
    if(G.armed){build(G.armed,c,r);return;}
    G.sel=(G.sel&&G.sel.kind==='spot'&&G.sel.c===c&&G.sel.r===r)?null:{kind:'spot',c,r};barDirty=true;sfx('tap');if(tut===0&&G.sel)tutStep(1);return;}
  if(G.sel||G.armed){G.sel=null;G.armed=null;barDirty=true;renderAbil();}
});
goBtn.addEventListener('pointerdown',ev=>{ev.preventDefault();audioInit();startWave();});
$('bSpeed').addEventListener('pointerdown',ev=>{ev.preventDefault();if(!G)return;G.speed=G.speed===1?2:1;syncSpeed();});
function syncSpeed(){const b=$('bSpeed');b.textContent=(G?G.speed:1)+'×';b.classList.toggle('on',!!G&&G.speed===2);}
const SND_ICON=['🔊','🎵','🔇'];
$('bMute').addEventListener('pointerdown',ev=>{ev.preventDefault();sndState=(sndState+1)%3;LS.set('od2_snd',sndState);audioInit();applySnd();syncMute();if(sndState<2)sfx('coin');showBanner(['Sound + music on','Music off','All sound off'][sndState]);});
function syncMute(){const b=$('bMute');b.textContent=SND_ICON[sndState];b.style.textDecoration=sndState===1?'line-through':'none';}
$('bPause').addEventListener('pointerdown',ev=>{ev.preventDefault();if(!G||G.over)return;setPause(!G.paused);});
function setPause(p){if(!G||G.over)return;G.paused=p;$('bPause').textContent=p?'▶':'⏸';
  if(p){musicStop();showOv('<h2>⏸ Paused</h2><p>'+MAP.name+' · '+G.D.name+'<br>Wave '+G.wave+'/'+TOTAL_WAVES+' · 🥭 '+G.lives+' · 💰 '+G.money+'</p><button class="bb" data-o="resume">▶ Resume</button><div class="row2"><button class="bb alt" data-o="restart">↻ Restart</button><button class="bb alt" data-o="menu">☰ Menu</button></div><p style="font-size:12px;opacity:.75">Progress is saved after each wave.</p>');}
  else{hideOv();musicStart();}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&!G.over){if(!G.running)saveGame();if(!G.paused&&ov.classList.contains('hide'))setPause(true);}});
// ---------- tutorial ----------
function tutStep(n){tut=n;LS.set('od2_tut',n);document.querySelectorAll('.tut').forEach(e=>e.classList.remove('tut'));barDirty=true;updateGo();showTip();}
let tipT=0;
function showTip(){if(!G||tut>=5){tipEl.style.display='none';return;}
  const msg=['👆 Tap the glowing grass square to build there','Now pick the <b>Farmer</b> below ($50)','Tap <b>Start Wave</b> when you\'re ready!','That\'s <b>Jesse</b> (you!) – tap him, then tap the map to move him. He buffs nearby towers.','Tap a tower to upgrade it. Use ☕ <b>Smoko</b> and 🛻 <b>Ute</b> when it gets hairy!'][tut];
  tipEl.innerHTML=msg;tipEl.style.display='block';
  let y=H*.5;if(tut===0&&G.tutSpot)y=OY+(G.tutSpot[1]+1.4)*T;else if(tut===1)y=H-50;else if(tut===2)y=H-110;else if(tut===3)y=Math.max(60,OY+(G.hero.y-2.4)*T);else y=H*.22;
  tipEl.style.top=y+'px';if(tut>=3)tipT=7;}
// ---------- save / progress ----------
function saveGame(){if(!G||G.over)return;LS.set('od2_save',{v:2,map:G.map,diff:G.diff,wave:G.wave,money:G.money,lives:G.lives,score:G.score,kills:G.kills,
  towers:G.towers.map(t=>({type:t.type,c:t.c,r:t.r,lv:t.lv,br:t.br,spent:t.spent})),hero:{x:G.hero.x,y:G.hero.y,lv:G.hero.lv,xp:G.hero.xp}});}
function loadGame(){const s=LS.get('od2_save',null);if(!s||s.v!==2)return false;newGame(s.map,s.diff);
  Object.assign(G,{wave:s.wave,money:s.money,lives:s.lives,score:s.score,kills:s.kills});
  for(const t of s.towers)G.towers.push({type:t.type,c:t.c,r:t.r,x:t.c+.5,y:t.r+.5,lv:t.lv,br:t.br,cd:0,ang:-1.57,anim:0,spin:0,spent:t.spent,dogs:[],drones:[],heat:0});
  Object.assign(G.hero,s.hero,{tx:s.hero.x,ty:s.hero.y});hudDirty=barDirty=true;updateGo();updatePreview();renderAbil();return true;}
// ---------- overlays / menus ----------
function showOv(h){ov.innerHTML='<div class="card">'+h+'</div>';ov.classList.remove('hide');}
function hideOv(){ov.classList.add('hide');}
function starStr(n){return '★'.repeat(n)+'<span style="opacity:.25">'+'★'.repeat(3-n)+'</span>';}
function thumb(mi){const sv=[MAP,PATHS,grid];setupMap(mi);const u=withCanvas(60,S=>{const t=S/COLS;ctx.fillStyle=MAPS[mi].grass[0];ctx.fillRect(0,0,S,S);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#c49a62';ctx.lineWidth=S/ROWS*.8;
  for(const P of PATHS){ctx.beginPath();P.pts.forEach(([x,y],i)=>{const px=(x+.5)*S/COLS,py=(y+.5)*S/ROWS;i?ctx.lineTo(px,py):ctx.moveTo(px,py);});ctx.stroke();}
  for(const d of MAPS[mi].decor)if(d[2]==='water'){ctx.fillStyle='#4f97c9';ctx.fillRect(d[0]*S/COLS,d[1]*S/ROWS,S/COLS+1,S/ROWS+1);}ctx.fillStyle='#2e7d32';ctx.fillRect(0,S*14/16,S,S*2/16);ctx.fillStyle='#ffb300';for(let i=0;i<5;i++){ctx.beginPath();ctx.arc((i+.5)*S/5,S*.94,2,0,TAU);ctx.fill();}});
  [MAP,PATHS,grid]=sv;return u;}
let THUMBS=null;
function titleScreen(){G=null;musicStop();abilEl.innerHTML='';abilEl.dataset.b='';goBtn.style.display='none';prevEl.style.display='none';tipEl.style.display='none';bar.innerHTML='';
  const sv=LS.get('od2_save',null);
  showOv('<img class="logo" src="'+LOGO+'" alt=""><h1>Orchard Defence</h1><p>Pests are coming for the Strathdickie mangoes! Build defences, send <b>Jesse</b> into the fray, and save the crop.</p>'+
   (sv&&sv.v===2?'<button class="bb gold" data-o="continue">▶ Continue<br><span style="font-size:13px">'+MAPS[sv.map].name+' · '+DIFFS[sv.diff].name+' · wave '+sv.wave+'/'+TOTAL_WAVES+'</span></button>':'')+
   '<button class="bb" data-o="maps">'+(sv?'New game':'▶ Play')+'</button><button class="bb alt" data-o="help">How to play</button>');}
function helpScreen(){showOv('<h2>How to play</h2><p style="font-size:13px">Tap a grass square, then pick a tower. Tap a tower to upgrade; at level 3 you choose one of two special upgrades. Tap <b>Jesse</b> then tap the map to move him – nearby towers fire faster. Smoko boosts every tower; the Ute runs down the track flattening pests.</p>'+
  '<h3>Towers</h3><div class="legend">'+TORDER.map(k=>'<div><img src="'+ICONS[k]+'" alt=""><b>'+TOWERS[k].name+'</b><br><span style="font-size:11px">'+TOWERS[k].desc+'</span></div>').join('')+'</div>'+
  '<h3>Pests</h3><div class="legend">'+Object.keys(ENEMIES).map(k=>'<div><img src="'+EICONS[k]+'" alt="">'+ENEMIES[k].name+(ENEMIES[k].air?' ✈':'')+(ENEMIES[k].armor?' 🛡':'')+'</div>').join('')+'</div>'+
  '<p style="font-size:11.5px">✈ flyer (ground-only towers can\'t hit it) · 🛡 armoured (Zapper, Sharpshooter & Toxic Mix pierce). Goats ram, emus sprint when hit, crows steal cash, fox camps split.</p><button class="bb" data-o="back">Got it</button>');}
function mapScreen(){if(!THUMBS)THUMBS=MAPS.map((m,i)=>thumb(i));
  showOv('<h2>Choose a paddock</h2><div class="maps">'+MAPS.map((m,i)=>{const lock=i>=prog.unlocked,st=prog.stars[i+'-'+menuDiff]||0;
    return '<button class="mp'+(i===menuMap?' sel':'')+(lock?' lock':'')+'" data-m="'+i+'"><img src="'+THUMBS[i]+'" alt=""><div><b>'+(i+1)+'. '+m.name+'</b>'+(lock?' 🔒':'')+'<br>'+(lock?'Beat '+MAPS[i-1].name+' to unlock':m.desc)+'<br><span class="st">'+starStr(st)+'</span></div></button>';}).join('')+'</div>'+
    '<h3>Difficulty</h3><div class="diff">'+Object.keys(DIFFS).map(k=>'<button class="'+(k===menuDiff?'sel':'')+'" data-d="'+k+'">'+DIFFS[k].name+'<small>'+DIFFS[k].sub+'</small></button>').join('')+'</div>'+
    '<button class="bb" data-o="start">▶ Start</button><button class="bb alt" data-o="back">Back</button>');}
ov.addEventListener('pointerdown',ev=>{const b=ev.target.closest('button');if(!b)return;ev.preventDefault();audioInit();sfx('tap');
  if(b.dataset.m!=null){const i=+b.dataset.m;if(i<prog.unlocked){menuMap=i;mapScreen();}else sfx('err');return;}
  if(b.dataset.d){menuDiff=b.dataset.d;LS.set('od2_diff',menuDiff);mapScreen();return;}
  const o=b.dataset.o;
  if(o==='maps')mapScreen();else if(o==='help')helpScreen();else if(o==='back')titleScreen();
  else if(o==='start'){LS.del('od2_save');startGame(menuMap,menuDiff);}
  else if(o==='continue'){if(loadGame())afterStart();}
  else if(o==='restart'){const m=G.map,d=G.diff;LS.del('od2_save');startGame(m,d);}
  else if(o==='next'){menuMap=Math.min(2,G.map+1);LS.del('od2_save');startGame(menuMap,G.diff);}
  else if(o==='menu'){if(G&&!G.over&&!G.running)saveGame();titleScreen();}
  else if(o==='resume')setPause(false);});
function startGame(mi,diff){newGame(mi,diff);
  if(tut<5){let best=null,bs=-1;for(let r=0;r<6;r++)for(let c=0;c<COLS;c++)if(grid[r][c]===0){let n=0;for(let rr2=r-2;rr2<=r+2;rr2++)for(let cc=c-2;cc<=c+2;cc++)if(rr2>=0&&rr2<ROWS&&cc>=0&&cc<COLS&&grid[rr2][cc]===1&&Math.hypot(rr2-r,cc-c)<=2.2)n++;if(n>bs){bs=n;best=[c,r];}}G.tutSpot=best;tut=0;}
  afterStart();}
function afterStart(){hideOv();$('bPause').textContent='⏸';syncSpeed();musicStart();showBanner(MAP.name,G.D.name+' · '+TOTAL_WAVES+' waves');renderAbil();if(tut<5)setTimeout(showTip,300);}
function endGame(won){
  if(G.over)return;G.over=true;G.running=false;G.sel=null;barDirty=true;musicStop();LS.del('od2_save');renderAbil();
  const ratio=G.lives/G.maxLives,stars=won?(ratio>=.9?3:ratio>=.5?2:1):0;
  if(won)G.score+=G.lives*100+G.money;G.score=Math.round(G.score*G.D.score);
  const key=G.map+'-'+G.diff,prevBest=prog.best[key]||0,nb=G.score>prevBest;if(nb)prog.best[key]=G.score;
  let unlockedNew=false;if(won){prog.stars[key]=Math.max(prog.stars[key]||0,stars);if(G.map+2>prog.unlocked&&G.map<2){prog.unlocked=G.map+2;unlockedNew=true;}}
  LS.set('od2_prog',prog);updateGo();updatePreview();sfx(won?'win':'lose');vib(won?[60,60,60,60,200]:[300]);
  if(won)for(let i=0;i<60;i++)setTimeout(()=>{if(G)addPart(Math.random()*W,Math.random()*H*.5,10,['#ffd54f','#ff7043','#66bb6a','#4fc3f7','#fff'][i%5],140,4,1.2,120);},i*25);
  setTimeout(()=>{
    if(won){showOv('<h2>🏆 Orchard Saved!</h2><div class="stars">'+[0,1,2].map(i=>'<span id="st'+i+'">★</span>').join('')+'</div><p>'+MAP.name+' · '+G.D.name+'<br>All '+TOTAL_WAVES+' waves seen off – the mangoes are safe!</p><p><b>Score '+G.score+'</b> · 🥭 '+G.lives+'/'+G.maxLives+' · '+G.kills+' pests · Jesse Lv '+G.hero.lv+'</p>'+(nb?'<p class="best">New best score!</p>':'<p class="best">Best: '+prevBest+'</p>')+
      (unlockedNew?'<p class="best">🔓 '+MAPS[G.map+1].name+' unlocked!</p>':'')+(G.map<2&&prog.unlocked>G.map+1?'<button class="bb gold" data-o="next">Next paddock ▶</button>':'')+'<div class="row2"><button class="bb alt" data-o="restart">↻ Replay</button><button class="bb alt" data-o="menu">☰ Menu</button></div>');
      for(let i=0;i<stars;i++)setTimeout(()=>{const e=$('st'+i);if(e){e.classList.add('on');sfx('star');vib(25);}},350+i*380);}
    else showOv('<h2>The pests got the mangoes!</h2><p style="font-size:44px;margin:4px">🐗💥</p><p>'+MAP.name+' · '+G.D.name+'<br>You held out until wave '+G.wave+' of '+TOTAL_WAVES+'.</p><p><b>Score '+G.score+'</b> · '+G.kills+' pests stopped</p>'+(nb?'<p class="best">New best score!</p>':'')+'<button class="bb" data-o="restart">↻ Try again</button><button class="bb alt" data-o="menu">☰ Menu</button>');
  },won?1000:800);
}
// ---------- loop ----------
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;if(dt<0)dt=0;
  if(G&&!G.paused&&!G.over){for(let i=0;i<G.speed;i++){update(dt);if(G.over)break;}}
  else if(G&&G.over){for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.life-=dt;}G.parts=G.parts.filter(p=>p.life>0);}
  if(bannerT>0){bannerT-=dt;if(bannerT<=0)banner.classList.remove('show');}
  if(tipT>0){tipT-=dt;if(tipT<=0){if(tut===3)tipEl.style.display='none';else if(tut===4)tutStep(5);}}
  if(G){if(hudDirty)updHud();if(barDirty||lastMoney!==G.money)renderBar();render();}
  else{ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#3f7a22';ctx.fillRect(0,0,W,H);}
  requestAnimationFrame(frame);
}
['touchmove','gesturestart','dblclick'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,250));
if(window.ResizeObserver)new ResizeObserver(()=>resize()).observe(wrap);
resize();
const LOGO=withCanvas(96,S=>{const g=ctx.createLinearGradient(0,0,0,S);g.addColorStop(0,'#7cb342');g.addColorStop(1,'#2e5d1e');ctx.fillStyle=g;rr(ctx,0,0,S,S,S*.2);ctx.fill();
  ctx.strokeStyle='#c49a62';ctx.lineWidth=S*.12;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(S*.15,0);ctx.lineTo(S*.15,S*.35);ctx.lineTo(S*.85,S*.35);ctx.lineTo(S*.85,S*.7);ctx.lineTo(S*.5,S*.7);ctx.lineTo(S*.5,S);ctx.stroke();
  E(S*.5,S*.55,S*.24,S*.28,'#ffb300',.4);E(S*.56,S*.62,S*.13,S*.15,'#ef6c00',.4);E(S*.6,S*.27,S*.14,S*.06,'#2e7d32',-.5);O(S*.42,S*.45,S*.05,'rgba(255,255,255,.6)');heroSprite(S*.2,S*.72,S*.22,0,false,1,-.3,0);});
syncMute();titleScreen();requestAnimationFrame(frame);
window.__cover=(c,r,type)=>{if(grid[r][c]!==0)return -1;const R=TOWERS[type].lv[0].range;let n=0;for(const P of PATHS)for(let d=0;d<P.len;d+=.25){const q=posAt(PATHS.indexOf(P),d);if(Math.hypot(q.x-c-.5,q.y-r-.5)<=R)n++;}return n;};
window.__od={get G(){return G},startGame,startWave,build,upgrade,useSmoko,useUte,loadGame,saveGame,layout:()=>({T,OX,OY,W,H}),
  ff:s=>{for(let i=0;i<s*60&&G&&!G.over;i++)update(1/60);},setTut:n=>tutStep(n)};
if(/^https?:$/.test(location.protocol)){
  const l=document.createElement('link');l.rel='manifest';l.href='manifest.json';document.head.appendChild(l);
  const a=document.createElement('link');a.rel='apple-touch-icon';a.href='icon-192.png';document.head.appendChild(a);
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
})();
